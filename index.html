<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>SAMEER THAPA - AI WAR ROAD</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  touch-action:none;
  user-select:none;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,sans-serif;
}

#game{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  display:block;
  background:#000;
}

#hud{
  position:fixed;
  top:10px;
  left:10px;
  right:10px;
  z-index:10;
  color:white;
  pointer-events:none;
}

#name{
  font-size:20px;
  font-weight:900;
  letter-spacing:2px;
  text-shadow:0 0 12px red;
}

#info{
  margin-top:5px;
  display:flex;
  justify-content:space-between;
  font-size:13px;
  font-weight:bold;
}

#healthBox{
  margin-top:7px;
  width:150px;
  height:9px;
  border:1px solid white;
  background:#222;
}

#health{
  width:100%;
  height:100%;
  background:#e00000;
}

#controls{
  position:fixed;
  left:0;
  right:0;
  bottom:22px;
  z-index:20;
  height:120px;
  pointer-events:none;
}

.control{
  position:absolute;
  pointer-events:auto;
  border:2px solid #ff2020;
  background:rgba(10,10,10,.82);
  color:white;
  font-weight:900;
  border-radius:16px;
  box-shadow:0 0 18px rgba(255,0,0,.55);
  -webkit-tap-highlight-color:transparent;
}

#left{
  left:18px;
  bottom:10px;
  width:72px;
  height:72px;
  font-size:28px;
}

#right{
  left:102px;
  bottom:10px;
  width:72px;
  height:72px;
  font-size:28px;
}

#missile{
  right:102px;
  bottom:10px;
  width:82px;
  height:72px;
  font-size:12px;
}

#bomb{
  right:12px;
  bottom:10px;
  width:82px;
  height:72px;
  font-size:12px;
}

#screen{
  position:fixed;
  inset:0;
  z-index:50;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.88);
  color:white;
  text-align:center;
  padding:25px;
}

.panel{
  width:min(90vw,420px);
  padding:28px 20px;
  border:2px solid #e00000;
  border-radius:22px;
  background:linear-gradient(#100000,#020202);
  box-shadow:0 0 35px rgba(255,0,0,.5);
}

.panel h1{
  color:#ff2020;
  font-size:28px;
  margin-bottom:10px;
  text-shadow:0 0 15px red;
}

.panel h2{
  font-size:18px;
  margin-bottom:12px;
}

.panel p{
  color:#ddd;
  line-height:1.5;
  margin-bottom:18px;
}

#startBtn{
  border:0;
  border-radius:14px;
  padding:15px 30px;
  background:#d50000;
  color:white;
  font-weight:900;
  font-size:17px;
  box-shadow:0 0 22px red;
}

.hidden{
  display:none !important;
}

#levelText{
  color:#fff;
  font-size:14px;
  margin-top:3px;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
  <div id="name">SAMEER THAPA</div>

  <div id="info">
    <span>LEVEL <b id="level">1</b></span>
    <span>TIME <b id="time">02:00</b></span>
    <span>SCORE <b id="score">0</b></span>
  </div>

  <div id="healthBox">
    <div id="health"></div>
  </div>
</div>

<div id="controls">
  <button class="control" id="left">◀</button>
  <button class="control" id="right">▶</button>
  <button class="control" id="missile">MISSILE</button>
  <button class="control" id="bomb">BOMB</button>
</div>

<div id="screen">
  <div class="panel">
    <h1>SAMEER THAPA</h1>
    <h2>AI WAR ROAD</h2>
    <p>
      2 MINUTES PER LEVEL<br>
      Destroy the AI villains.<br>
      Reach the target score to PASS.<br>
      Unlimited levels.
    </p>
    <button id="startBtn">START GAME</button>
  </div>
</div>

<script>

/* =========================================================
   SAMEER THAPA - AI WAR ROAD
   SINGLE FILE GAME
========================================================= */

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W=0;
let H=0;

function resize(){

  W=canvas.width=window.innerWidth;
  H=canvas.height=window.innerHeight;

  if(player){
    player.x=Math.max(70,Math.min(W-70,player.x));
  }
}

window.addEventListener("resize",resize);


/* =========================================================
   GAME STATE
========================================================= */

let running=false;

let level=1;
let score=0;

const LEVEL_TIME=120;

let timeLeft=LEVEL_TIME;

let levelStart=0;

let lastFrame=0;

let enemyTimer=0;

let missileCooldown=0;
let bombCooldown=0;

let shake=0;

let roadOffset=0;

let keys={
  left:false,
  right:false
};


/* =========================================================
   PLAYER
========================================================= */

let player={
  x:window.innerWidth/2,
  y:window.innerHeight*0.66,
  w:72,
  h:112,
  speed:8,
  health:100
};


/* =========================================================
   OBJECTS
========================================================= */

let missiles=[];
let bombs=[];
let enemies=[];
let explosions=[];
let particles=[];


/* =========================================================
   AUDIO
========================================================= */

let audioCtx=null;

function startAudio(){

  if(audioCtx) return;

  try{
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  }catch(e){}
}

function tone(freq,duration,type="square",volume=.05){

  if(!audioCtx)return;

  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();

  osc.type=type;
  osc.frequency.value=freq;

  gain.gain.setValueAtTime(volume,audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(
    .001,
    audioCtx.currentTime+duration
  );

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start();
  osc.stop(audioCtx.currentTime+duration);
}

function engineSound(){

  tone(75,.08,"sawtooth",.025);
}

function missileSound(){

  tone(700,.08,"sawtooth",.06);
  setTimeout(()=>tone(1100,.08,"sawtooth",.04),35);
}

function bombSound(){

  tone(90,.18,"sine",.09);
}

function explosionSound(){

  tone(70,.22,"sawtooth",.09);
  setTimeout(()=>tone(45,.25,"square",.05),60);
}


/* =========================================================
   ROAD
========================================================= */

function drawRoad(){

  ctx.fillStyle="#020202";
  ctx.fillRect(0,0,W,H);

  const roadW=Math.min(W*.86,460);
  const roadX=(W-roadW)/2;

  ctx.fillStyle="#111";
  ctx.fillRect(roadX,0,roadW,H);

  /* road glow */

  ctx.fillStyle="#b00000";
  ctx.fillRect(roadX,0,5,H);
  ctx.fillRect(roadX+roadW-5,0,5,H);

  /* lane lines */

  ctx.strokeStyle="#333";
  ctx.lineWidth=3;
  ctx.setLineDash([35,35]);

  roadOffset+=7;

  ctx.lineDashOffset=roadOffset;

  for(let i=1;i<3;i++){

    const x=roadX+(roadW/3)*i;

    ctx.beginPath();
    ctx.moveTo(x,0);
    ctx.lineTo(x,H);
    ctx.stroke();
  }

  ctx.setLineDash([]);

  /* road lights */

  for(let y=40;y<H;y+=100){

    ctx.fillStyle="#ff0000";

    ctx.fillRect(
      roadX+10,
      (y+roadOffset)%H,
      4,
      20
    );

    ctx.fillRect(
      roadX+roadW-14,
      (y+roadOffset)%H,
      4,
      20
    );
  }
}


/* =========================================================
   VIP AI CAR
========================================================= */

function drawPlayer(){

  const x=player.x;

  /*
    FIXED HIGH POSITION
    Car stays above the lower control area.
  */

  const y=player.y;

  ctx.save();

  /* shadow */

  ctx.fillStyle="rgba(0,0,0,.8)";
  ctx.fillRect(x-42,y+42,84,18);

  /* black body */

  ctx.fillStyle="#050505";

  ctx.beginPath();
  ctx.moveTo(x-34,y+45);
  ctx.lineTo(x-40,y-20);
  ctx.lineTo(x-27,y-58);
  ctx.lineTo(x+27,y-58);
  ctx.lineTo(x+40,y-20);
  ctx.lineTo(x+34,y+45);
  ctx.closePath();
  ctx.fill();

  /* red armor */

  ctx.fillStyle="#c40000";

  ctx.beginPath();
  ctx.moveTo(x-28,y+42);
  ctx.lineTo(x-32,y-18);
  ctx.lineTo(x-21,y-50);
  ctx.lineTo(x+21,y-50);
  ctx.lineTo(x+32,y-18);
  ctx.lineTo(x+28,y+42);
  ctx.closePath();
  ctx.fill();

  /* windshield */

  ctx.fillStyle="#050505";

  ctx.beginPath();
  ctx.moveTo(x-20,y-40);
  ctx.lineTo(x+20,y-40);
  ctx.lineTo(x+15,y-8);
  ctx.lineTo(x-15,y-8);
  ctx.closePath();
  ctx.fill();

  /* AI core */

  ctx.fillStyle="#ff1111";
  ctx.shadowColor="red";
  ctx.shadowBlur=20;

  ctx.fillRect(x-7,y-27,14,9);

  /* lights */

  ctx.fillRect(x-27,y-51,12,6);
  ctx.fillRect(x+15,y-51,12,6);

  ctx.shadowBlur=0;

  /* side armor */

  ctx.fillStyle="#111";

  ctx.fillRect(x-40,y-5,10,40);
  ctx.fillRect(x+30,y-5,10,40);

  /* red side lights */

  ctx.fillStyle="#ff3000";

  ctx.fillRect(x-40,y+24,10,6);
  ctx.fillRect(x+30,y+24,10,6);

  /* wheels */

  ctx.fillStyle="#000";

  ctx.fillRect(x-38,y+4,9,34);
  ctx.fillRect(x+29,y+4,9,34);

  /* front weapon ports */

  ctx.fillStyle="#ff0000";

  ctx.fillRect(x-15,y+42,8,4);
  ctx.fillRect(x+7,y+42,8,4);

  ctx.restore();
}


/* =========================================================
   ENEMIES
========================================================= */

function spawnEnemy(){

  const roadW=Math.min(W*.86,460);
  const roadX=(W-roadW)/2;
  const laneW=roadW/3;

  const lane=Math.floor(Math.random()*3);

  const x=
    roadX+
    laneW*lane+
    laneW/2;

  const hp=
    1+
    Math.floor(level/5);

  enemies.push({

    x:x,
    y:-100,
    w:58,
    h:82,
    speed:2.5+
      Math.random()*1.8+
      level*.12,
    hp:hp,
    maxHp:hp,
    type:Math.floor(Math.random()*3)
  });
}


function drawEnemy(e){

  ctx.save();

  ctx.translate(e.x,e.y);

  /* aura */

  ctx.fillStyle="rgba(255,0,0,.12)";
  ctx.beginPath();
  ctx.arc(0,0,48,0,Math.PI*2);
  ctx.fill();

  /* body */

  ctx.fillStyle=
    e.type===0 ? "#230000":
    e.type===1 ? "#001522":
                 "#160016";

  ctx.beginPath();
  ctx.moveTo(-28,35);
  ctx.lineTo(-31,-25);
  ctx.lineTo(-15,-42);
  ctx.lineTo(15,-42);
  ctx.lineTo(31,-25);
  ctx.lineTo(28,35);
  ctx.closePath();
  ctx.fill();

  /* armor */

  ctx.strokeStyle=
    e.type===0 ? "#ff0000":
    e.type===1 ? "#00aaff":
                 "#ff00aa";

  ctx.lineWidth=4;

  ctx.stroke();

  /* eyes */

  ctx.fillStyle="#ff0000";
  ctx.shadowColor="red";
  ctx.shadowBlur=15;

  ctx.fillRect(-18,-20,10,6);
  ctx.fillRect(8,-20,10,6);

  ctx.shadowBlur=0;

  /* weapon */

  ctx.fillStyle="#222";
  ctx.fillRect(-38,5,10,25);
  ctx.fillRect(28,5,10,25);

  ctx.restore();

  /* HP */

  if(e.hp<e.maxHp){

    const ratio=e.hp/e.maxHp;

    ctx.fillStyle="#400";
    ctx.fillRect(e.x-30,e.y-55,60,5);

    ctx.fillStyle="#0f0";
    ctx.fillRect(e.x-30,e.y-55,60*ratio,5);
  }
}


/* =========================================================
   MISSILE
========================================================= */

function fireMissile(){

  if(!running)return;
  if(missileCooldown>0)return;

  missileCooldown=.35;

  missiles.push({

    x:player.x,
    y:player.y-60,
    speed:13,
    damage:1
  });

  missileSound();
}


function drawMissile(m){

  ctx.save();

  ctx.fillStyle="#fff";
  ctx.shadowColor="#ff0000";
  ctx.shadowBlur=14;

  ctx.fillRect(m.x-3,m.y,6,20);

  ctx.fillStyle="#ff3000";
  ctx.fillRect(m.x-2,m.y+18,4,10);

  ctx.restore();
}


/* =========================================================
   BOMB
========================================================= */

function dropBomb(){

  if(!running)return;
  if(bombCooldown>0)return;

  bombCooldown=1.0;

  bombs.push({

    x:player.x,
    y:player.y-35,
    speed:6,
    radius:70
  });

  bombSound();
}


function drawBomb(b){

  ctx.save();

  ctx.fillStyle="#111";
  ctx.shadowColor="#ff0000";
  ctx.shadowBlur=15;

  ctx.beginPath();
  ctx.arc(b.x,b.y,10,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#ff0000";
  ctx.fillRect(b.x-3,b.y-15,6,5);

  ctx.restore();
}


/* =========================================================
   EXPLOSION
========================================================= */

function explode(x,y,power=1){

  explosions.push({
    x:x,
    y:y,
    r:5,
    max:70*power,
    life:30
  });

  for(let i=0;i<20;i++){

    particles.push({

      x:x,
      y:y,

      vx:(Math.random()-.5)*8,
      vy:(Math.random()-.5)*8,

      life:25+
        Math.random()*25
    });
  }

  explosionSound();

  shake=10;
}


function drawExplosions(){

  for(let i=explosions.length-1;i>=0;i--){

    const e=explosions[i];

    ctx.save();

    ctx.strokeStyle=
      `rgba(255,${Math.floor(Math.random()*120)},0,${e.life/30})`;

    ctx.lineWidth=6;

    ctx.beginPath();
    ctx.arc(e.x,e.y,e.r,0,Math.PI*2);
    ctx.stroke();

    ctx.restore();

    e.r+=4;
    e.life--;

    if(e.life<=0){
      explosions.splice(i,1);
    }
  }

  for(let i=particles.length-1;i>=0;i--){

    const p=particles[i];

    ctx.fillStyle="#ff3300";
    ctx.fillRect(p.x,p.y,4,4);

    p.x+=p.vx;
    p.y+=p.vy;
    p.vy+=.15;
    p.life--;

    if(p.life<=0){
      particles.splice(i,1);
    }
  }
}


/* =========================================================
   COLLISIONS
========================================================= */

function hitEnemy(e,damage){

  e.hp-=damage;

  if(e.hp<=0){

    score+=100+level*10;

    explode(e.x,e.y,1);

    const index=enemies.indexOf(e);

    if(index>=0){
      enemies.splice(index,1);
    }
  }
}


function updateMissiles(){

  for(let i=missiles.length-1;i>=0;i--){

    const m=missiles[i];

    m.y-=m.speed;

    let hit=false;

    for(let j=enemies.length-1;j>=0;j--){

      const e=enemies[j];

      if(
        Math.abs(m.x-e.x)<35 &&
        Math.abs(m.y-e.y)<50
      ){

        hitEnemy(e,m.damage);

        hit=true;
        break;
      }
    }

    if(hit || m.y<-50){
      missiles.splice(i,1);
    }
  }
}


function updateBombs(){

  for(let i=bombs.length-1;i>=0;i--){

    const b=bombs[i];

    b.y-=b.speed;

    if(b.y<80){

      explode(b.x,b.y,1.5);

      for(let j=enemies.length-1;j>=0;j--){

        const e=enemies[j];

        const dx=e.x-b.x;
        const dy=e.y-b.y;

        const dist=Math.sqrt(dx*dx+dy*dy);

        if(dist<b.radius){
          hitEnemy(e,2);
        }
      }

      bombs.splice(i,1);
    }
  }
}


/* =========================================================
   ENEMY UPDATE
========================================================= */

function updateEnemies(){

  for(let i=enemies.length-1;i>=0;i--){

    const e=enemies[i];

    e.y+=e.speed;

    /* hit player */

    if(
      Math.abs(e.x-player.x)<45 &&
      Math.abs(e.y-player.y)<70
    ){

      player.health-=12;

      explode(e.x,e.y,.7);

      enemies.splice(i,1);

      continue;
    }

    /* passed player */

    if(e.y>H+100){

      player.health-=5;

      enemies.splice(i,1);
    }
  }
}


/* =========================================================
   PLAYER MOVEMENT
========================================================= */

function updatePlayer(){

  if(keys.left){
    player.x-=player.speed;
  }

  if(keys.right){
    player.x+=player.speed;
  }

  const roadW=Math.min(W*.86,460);
  const roadX=(W-roadW)/2;

  player.x=Math.max(
    roadX+45,
    Math.min(
      roadX+roadW-45,
      player.x
    )
  );
}


/* =========================================================
   LEVEL TARGET
========================================================= */

function targetScore(){

  return 500+(level-1)*250;
}


/* =========================================================
   UI
========================================================= */

function updateUI(){

  document.getElementById("level").textContent=level;
  document.getElementById("score").textContent=score;

  const sec=Math.max(0,Math.ceil(timeLeft));

  const min=Math.floor(sec/60);
  const s=sec%60;

  document.getElementById("time").textContent=
    String(min).padStart(2,"0")+
    ":"+
    String(s).padStart(2,"0");

  document.getElementById("health").style.width=
    Math.max(0,player.health)+"%";
}


/* =========================================================
   LEVEL PASS / FAIL
========================================================= */

function showResult(title,message,next){

  running=false;

  document.getElementById("screen").classList.remove("hidden");

  document.querySelector(".panel").innerHTML=`

    <h1>${title}</h1>

    <h2>SAMEER THAPA</h2>

    <p>${message}</p>

    <button id="startBtn">
      ${next ? "NEXT LEVEL" : "RETRY LEVEL"}
    </button>
  `;

  document.getElementById("startBtn")
    .onclick=()=>{

      if(next){
        level++;
      }

      startLevel();
    };
}


/* =========================================================
   START LEVEL
========================================================= */

function startLevel(){

  startAudio();

  if(audioCtx && audioCtx.state==="suspended"){
    audioCtx.resume();
  }

  running=true;

  timeLeft=LEVEL_TIME;

  levelStart=performance.now();

  player.health=100;

  /*
    VIP CAR POSITION
    This position is intentionally above
    the bottom controls.
  */

  player.y=H*.66;

  score=score;

  enemies=[];
  missiles=[];
  bombs=[];
  explosions=[];
  particles=[];

  missileCooldown=0;
  bombCooldown=0;

  document.getElementById("screen")
    .classList.add("hidden");

  updateUI();
}


/* =========================================================
   GAME OVER
========================================================= */

function failLevel(reason){

  showResult(
    "LEVEL FAILED",
    reason+
    "<br><br>Target: "+
    targetScore()+
    "<br>Your Score: "+
    score,
    false
  );
}


/* =========================================================
   MAIN LOOP
========================================================= */

function loop(now){

  requestAnimationFrame(loop);

  const dt=Math.min(
    .05,
    (now-lastFrame)/1000||0
  );

  lastFrame=now;

  if(!running){

    drawRoad();
    drawPlayer();

    return;
  }

  if(shake>0){

    shake*=.85;

    if(shake<.5)shake=0;
  }

  ctx.save();

  if(shake){
    ctx.translate(
      (Math.random()-.5)*shake,
      (Math.random()-.5)*shake
    );
  }

  drawRoad();

  updatePlayer();

  /* enemy spawning */

  enemyTimer-=dt;

  const spawnRate=
    Math.max(
      .25,
      1.1-level*.025
    );

  if(enemyTimer<=0){

    spawnEnemy();

    enemyTimer=spawnRate;
  }

  /* weapons */

  missileCooldown=
    Math.max(0,missileCooldown-dt);

  bombCooldown=
    Math.max(0,bombCooldown-dt);

  updateMissiles();
  updateBombs();
  updateEnemies();

  /* draw weapons */

  for(const m of missiles){
    drawMissile(m);
  }

  for(const b of bombs){
    drawBomb(b);
  }

  /* draw enemies */

  for(const e of enemies){
    drawEnemy(e);
  }

  /* player */

  drawPlayer();

  drawExplosions();

  ctx.restore();

  /* timer */

  timeLeft-=dt;

  /* health fail */

  if(player.health<=0){

    failLevel(
      "Your VIP AI car was destroyed."
    );

    return;
  }

  /* time finished */

  if(timeLeft<=0){

    timeLeft=0;

    if(score>=targetScore()){

      showResult(
        "LEVEL PASSED",
        "Target destroyed!<br>"+
        "Score: "+score+
        "<br><br>Get ready for the next AI battle.",
        true
      );

    }else{

      failLevel(
        "Target score was not reached."
      );
    }

    return;
  }

  updateUI();

  /* engine */

  if(Math.random()<.025){
    engineSound();
  }
}


/* =========================================================
   CONTROLS
========================================================= */

function holdButton(button,down,up){

  button.addEventListener(
    "pointerdown",
    e=>{
      e.preventDefault();
      down();
    }
  );

  button.addEventListener(
    "pointerup",
    e=>{
      e.preventDefault();
      up();
    }
  );

  button.addEventListener(
    "pointercancel",
    up
  );

  button.addEventListener(
    "pointerleave",
    up
  );
}


holdButton(
  document.getElementById("left"),
  ()=>{
    keys.left=true;
  },
  ()=>{
    keys.left=false;
  }
);


holdButton(
  document.getElementById("right"),
  ()=>{
    keys.right=true;
  },
  ()=>{
    keys.right=false;
  }
);


document.getElementById("missile")
.addEventListener(
  "pointerdown",
  e=>{
    e.preventDefault();
    fireMissile();
  }
);


document.getElementById("bomb")
.addEventListener(
  "pointerdown",
  e=>{
    e.preventDefault();
    dropBomb();
  }
);


/* =========================================================
   KEYBOARD
========================================================= */

window.addEventListener(
  "keydown",
  e=>{

    if(e.key==="ArrowLeft"){
      keys.left=true;
    }

    if(e.key==="ArrowRight"){
      keys.right=true;
    }

    if(e.key===" "){
      fireMissile();
    }

    if(e.key.toLowerCase()==="b"){
      dropBomb();
    }
  }
);


window.addEventListener(
  "keyup",
  e=>{

    if(e.key==="ArrowLeft"){
      keys.left=false;
    }

    if(e.key==="ArrowRight"){
      keys.right=false;
    }
  }
);


/* =========================================================
   START BUTTON
========================================================= */

document.getElementById("startBtn")
.onclick=()=>{

  startAudio();

  level=1;
  score=0;

  startLevel();
};


/* =========================================================
   START
========================================================= */

resize();

requestAnimationFrame(loop);

</script>

</body>
</html>
