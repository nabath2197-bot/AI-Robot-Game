<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>SAMEER THAPA - AI WAR ROAD</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  user-select:none;
  -webkit-user-select:none;
  touch-action:none;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,sans-serif;
}

#game{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  display:block;
  background:#000;
}

#hud{
  position:fixed;
  top:10px;
  left:10px;
  right:10px;
  z-index:20;
  color:#fff;
  pointer-events:none;
}

#name{
  font-size:20px;
  font-weight:900;
  letter-spacing:2px;
  text-shadow:0 0 12px red;
}

#info{
  margin-top:6px;
  display:flex;
  justify-content:space-between;
  font-size:13px;
  font-weight:900;
}

#healthBox{
  margin-top:7px;
  width:160px;
  height:10px;
  border:1px solid #fff;
  background:#222;
  border-radius:5px;
  overflow:hidden;
}

#health{
  width:100%;
  height:100%;
  background:#e00000;
}

#target{
  margin-top:5px;
  font-size:12px;
  color:#ff5555;
  font-weight:bold;
}

#controls{
  position:fixed;
  left:0;
  right:0;
  bottom:18px;
  height:92px;
  z-index:30;
  pointer-events:none;
}

.control{
  position:absolute;
  pointer-events:auto;
  border:2px solid #ff2020;
  background:rgba(5,5,5,.90);
  color:#fff;
  font-weight:900;
  border-radius:16px;
  box-shadow:
    0 0 12px rgba(255,0,0,.7),
    inset 0 0 12px rgba(255,0,0,.12);
  -webkit-tap-highlight-color:transparent;
}

.control:active{
  transform:scale(.94);
  background:#550000;
}

#left{
  left:14px;
  bottom:5px;
  width:68px;
  height:68px;
  font-size:27px;
}

#right{
  left:92px;
  bottom:5px;
  width:68px;
  height:68px;
  font-size:27px;
}

#missile{
  right:92px;
  bottom:5px;
  width:82px;
  height:68px;
  font-size:11px;
}

#bomb{
  right:8px;
  bottom:5px;
  width:76px;
  height:68px;
  font-size:11px;
}

#screen{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.90);
  color:#fff;
  text-align:center;
  padding:20px;
}

.panel{
  width:min(90vw,430px);
  padding:28px 20px;
  border:2px solid #e00000;
  border-radius:22px;
  background:
    radial-gradient(circle at center,#260000,#050505 70%);
  box-shadow:0 0 40px rgba(255,0,0,.55);
}

.panel h1{
  color:#ff2020;
  font-size:28px;
  margin-bottom:8px;
  text-shadow:0 0 15px red;
}

.panel h2{
  font-size:19px;
  margin-bottom:12px;
}

.panel p{
  color:#ddd;
  line-height:1.6;
  margin-bottom:20px;
}

#startBtn{
  border:0;
  border-radius:14px;
  padding:15px 34px;
  background:#d50000;
  color:#fff;
  font-weight:900;
  font-size:17px;
  box-shadow:0 0 25px red;
}

#startBtn:active{
  transform:scale(.95);
}

.hidden{
  display:none !important;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
  <div id="name">SAMEER THAPA</div>

  <div id="info">
    <span>LEVEL <b id="level">1</b></span>
    <span>TIME <b id="time">02:00</b></span>
    <span>SCORE <b id="score">0</b></span>
  </div>

  <div id="healthBox">
    <div id="health"></div>
  </div>

  <div id="target">
    TARGET: <span id="targetValue">500</span>
  </div>
</div>

<div id="controls">

  <button class="control" id="left">◀</button>

  <button class="control" id="right">▶</button>

  <button class="control" id="missile">
    🚀 MISSILE
  </button>

  <button class="control" id="bomb">
    💣 BOMB
  </button>

</div>

<div id="screen">

  <div class="panel">

    <h1>SAMEER THAPA</h1>

    <h2>⚡ AI WAR ROAD ⚡</h2>

    <p>
      2 MINUTES PER LEVEL<br>
      Destroy the AI villains.<br>
      Reach the target score to PASS.<br>
      Unlimited levels.
    </p>

    <button id="startBtn">
      START GAME
    </button>

  </div>

</div>


<script>

/* =========================================================
   SAMEER THAPA - AI WAR ROAD
   COMPLETE SINGLE FILE
========================================================= */

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W=0;
let H=0;


/* =========================================================
   GAME VARIABLES
========================================================= */

let running=false;

let level=1;

let score=0;

const LEVEL_TIME=120;

let timeLeft=LEVEL_TIME;

let levelStart=0;

let lastFrame=0;

let enemyTimer=0;

let missileCooldown=0;

let bombCooldown=0;

let shake=0;

let roadOffset=0;

let levelMessage="";

let levelMessageTimer=0;


/* =========================================================
   CONTROLS
========================================================= */

let keys={
  left:false,
  right:false
};


/* =========================================================
   PLAYER
========================================================= */

let player={

  x:0,

  /*
    IMPORTANT:
    CAR IS ALWAYS AROUND THE MIDDLE
    AND ABOVE THE BUTTONS.
  */

  y:0,

  w:72,

  h:112,

  speed:8,

  health:100

};


/* =========================================================
   OBJECTS
========================================================= */

let missiles=[];

let bombs=[];

let enemies=[];

let explosions=[];

let particles=[];


/* =========================================================
   AUDIO
========================================================= */

let audioCtx=null;

function startAudio(){

  if(audioCtx)return;

  try{

    audioCtx=
      new(window.AudioContext||window.webkitAudioContext)();

  }catch(e){}

}


function tone(
  frequency,
  duration,
  type="square",
  volume=.05
){

  if(!audioCtx)return;

  try{

    const osc=
      audioCtx.createOscillator();

    const gain=
      audioCtx.createGain();

    osc.type=type;

    osc.frequency.value=frequency;

    gain.gain.setValueAtTime(
      volume,
      audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      .001,
      audioCtx.currentTime+duration
    );

    osc.connect(gain);

    gain.connect(audioCtx.destination);

    osc.start();

    osc.stop(
      audioCtx.currentTime+duration
    );

  }catch(e){}
}


function missileSound(){

  tone(600,.08,"sawtooth",.07);

  setTimeout(()=>{
    tone(1000,.10,"square",.05);
  },40);

}


function bombSound(){

  tone(80,.25,"sine",.12);

  setTimeout(()=>{
    tone(45,.35,"sawtooth",.08);
  },100);

}


function explosionSound(){

  tone(90,.20,"sawtooth",.10);

  setTimeout(()=>{
    tone(45,.30,"square",.06);
  },60);

}


function hitSound(){

  tone(180,.06,"square",.04);

}


function passSound(){

  tone(500,.12,"square",.06);

  setTimeout(()=>{
    tone(800,.12,"square",.06);
  },120);

  setTimeout(()=>{
    tone(1100,.18,"square",.06);
  },240);

}


function failSound(){

  tone(220,.15,"sawtooth",.06);

  setTimeout(()=>{
    tone(130,.25,"sawtooth",.07);
  },160);

}


/* =========================================================
   RESPONSIVE PLAYER POSITION
========================================================= */

function setPlayerPosition(){

  player.x=Math.max(
    60,
    Math.min(W-60,W/2)
  );

  /*
    50% SCREEN HEIGHT.
    This keeps the whole car visible
    and safely above the controls.
  */

  player.y=H*.50;

}


function resize(){

  W=
    canvas.width=
    window.innerWidth;

  H=
    canvas.height=
    window.innerHeight;

  setPlayerPosition();

}

window.addEventListener(
  "resize",
  resize
);


/* =========================================================
   ROAD
========================================================= */

function drawRoad(){

  ctx.fillStyle="#010101";

  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  const roadW=
    Math.min(
      W*.88,
      470
    );

  const roadX=
    (W-roadW)/2;


  /* road */

  ctx.fillStyle="#101010";

  ctx.fillRect(
    roadX,
    0,
    roadW,
    H
  );


  /* outer glow */

  ctx.fillStyle="#a00000";

  ctx.fillRect(
    roadX,
    0,
    5,
    H
  );

  ctx.fillRect(
    roadX+roadW-5,
    0,
    5,
    H
  );


  /* lanes */

  ctx.strokeStyle="#303030";

  ctx.lineWidth=3;

  ctx.setLineDash([
    35,
    35
  ]);

  roadOffset+=7;

  ctx.lineDashOffset=
    roadOffset;


  for(let i=1;i<3;i++){

    const x=
      roadX+
      (roadW/3)*i;

    ctx.beginPath();

    ctx.moveTo(
      x,
      0
    );

    ctx.lineTo(
      x,
      H
    );

    ctx.stroke();

  }

  ctx.setLineDash([]);


  /* road lights */

  for(
    let y=20;
    y<H+100;
    y+=100
  ){

    let yy=
      (y+roadOffset)%H;

    ctx.fillStyle="#ff0000";

    ctx.fillRect(
      roadX+10,
      yy,
      4,
      22
    );

    ctx.fillRect(
      roadX+roadW-14,
      yy,
      4,
      22
    );

  }

}


/* =========================================================
   PLAYER - FUTURISTIC AI CAR
========================================================= */

function drawPlayer(){

  const x=player.x;

  const y=player.y;

  ctx.save();


  /* shadow */

  ctx.fillStyle=
    "rgba(0,0,0,.8)";

  ctx.beginPath();

  ctx.ellipse(
    x,
    y+48,
    44,
    12,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* red glow */

  ctx.shadowColor="#ff0000";

  ctx.shadowBlur=18;


  /* main black body */

  ctx.fillStyle="#050505";

  ctx.beginPath();

  ctx.moveTo(
    x-34,
    y+45
  );

  ctx.lineTo(
    x-42,
    y-18
  );

  ctx.lineTo(
    x-27,
    y-58
  );

  ctx.lineTo(
    x+27,
    y-58
  );

  ctx.lineTo(
    x+42,
    y-18
  );

  ctx.lineTo(
    x+34,
    y+45
  );

  ctx.closePath();

  ctx.fill();


  ctx.shadowBlur=0;


  /* red armor */

  ctx.fillStyle="#c40000";

  ctx.beginPath();

  ctx.moveTo(
    x-27,
    y+42
  );

  ctx.lineTo(
    x-32,
    y-18
  );

  ctx.lineTo(
    x-21,
    y-50
  );

  ctx.lineTo(
    x+21,
    y-50
  );

  ctx.lineTo(
    x+32,
    y-18
  );

  ctx.lineTo(
    x+27,
    y+42
  );

  ctx.closePath();

  ctx.fill();


  /* windshield */

  ctx.fillStyle="#02080c";

  ctx.beginPath();

  ctx.moveTo(
    x-19,
    y-40
  );

  ctx.lineTo(
    x+19,
    y-40
  );

  ctx.lineTo(
    x+14,
    y-8
  );

  ctx.lineTo(
    x-14,
    y-8
  );

  ctx.closePath();

  ctx.fill();


  /* windshield shine */

  ctx.strokeStyle="#ff2020";

  ctx.lineWidth=2;

  ctx.beginPath();

  ctx.moveTo(
    x-14,
    y-35
  );

  ctx.lineTo(
    x+12,
    y-35
  );

  ctx.stroke();


  /* AI CORE */

  ctx.fillStyle="#ff1111";

  ctx.shadowColor="red";

  ctx.shadowBlur=22;

  ctx.fillRect(
    x-7,
    y-27,
    14,
    10
  );

  ctx.shadowBlur=0;


  /* headlights */

  ctx.fillStyle="#ff4a00";

  ctx.shadowColor="#ff3000";

  ctx.shadowBlur=12;

  ctx.fillRect(
    x-27,
    y-51,
    12,
    6
  );

  ctx.fillRect(
    x+15,
    y-51,
    12,
    6
  );

  ctx.shadowBlur=0;


  /* side armor */

  ctx.fillStyle="#111";

  ctx.fillRect(
    x-41,
    y-5,
    11,
    42
  );

  ctx.fillRect(
    x+30,
    y-5,
    11,
    42
  );


  /* side lights */

  ctx.fillStyle="#ff2200";

  ctx.fillRect(
    x-41,
    y+22,
    11,
    7
  );

  ctx.fillRect(
    x+30,
    y+22,
    11,
    7
  );


  /* wheels */

  ctx.fillStyle="#000";

  ctx.fillRect(
    x-39,
    y+2,
    10,
    38
  );

  ctx.fillRect(
    x+29,
    y+2,
    10,
    38
  );


  /* wheel red lines */

  ctx.fillStyle="#ff0000";

  ctx.fillRect(
    x-39,
    y+7,
    3,
    25
  );

  ctx.fillRect(
    x+36,
    y+7,
    3,
    25
  );


  /* weapon ports */

  ctx.fillStyle="#ff0000";

  ctx.shadowColor="red";

  ctx.shadowBlur=8;

  ctx.fillRect(
    x-15,
    y+40,
    8,
    5
  );

  ctx.fillRect(
    x+7,
    y+40,
    8,
    5
  );

  ctx.shadowBlur=0;


  /* bottom energy */

  ctx.fillStyle="#ff3000";

  ctx.fillRect(
    x-20,
    y+48,
    40,
    3
  );


  ctx.restore();

}


/* =========================================================
   ENEMY SPAWN
========================================================= */

function spawnEnemy(){

  const roadW=
    Math.min(
      W*.88,
      470
    );

  const roadX=
    (W-roadW)/2;

  const laneW=
    roadW/3;

  const lane=
    Math.floor(
      Math.random()*3
    );

  const x=
    roadX+
    laneW*lane+
    laneW/2;


  const hp=
    1+
    Math.floor(level/5);


  enemies.push({

    x:x,

    y:-90,

    w:58,

    h:82,

    speed:
      2.4+
      Math.random()*1.7+
      level*.12,

    hp:hp,

    maxHp:hp,

    type:
      Math.floor(
        Math.random()*3
      )

  });

}


/* =========================================================
   ENEMY DRAW
========================================================= */

function drawEnemy(e){

  ctx.save();

  ctx.translate(
    e.x,
    e.y
  );


  /* danger aura */

  ctx.fillStyle=
    "rgba(255,0,0,.12)";

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    45,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* body */

  ctx.fillStyle=
    e.type===0
      ? "#330000"
      : e.type===1
        ? "#111"
        : "#240024";


  ctx.beginPath();

  ctx.moveTo(
    -27,
    38
  );

  ctx.lineTo(
    -31,
    -25
  );

  ctx.lineTo(
    -18,
    -40
  );

  ctx.lineTo(
    18,
    -40
  );

  ctx.lineTo(
    31,
    -25
  );

  ctx.lineTo(
    27,
    38
  );

  ctx.closePath();

  ctx.fill();


  /* armor */

  ctx.strokeStyle="#ff0000";

  ctx.lineWidth=3;

  ctx.stroke();


  /* AI eye */

  ctx.fillStyle=
    e.type===2
      ? "#ff00ff"
      : "#ff0000";

  ctx.shadowColor=
    e.type===2
      ? "#ff00ff"
      : "#ff0000";

  ctx.shadowBlur=16;

  ctx.fillRect(
    -14,
    -17,
    28,
    7
  );

  ctx.shadowBlur=0;


  /* wheels */

  ctx.fillStyle="#000";

  ctx.fillRect(
    -31,
    5,
    8,
    27
  );

  ctx.fillRect(
    23,
    5,
    8,
    27
  );


  /* hp */

  ctx.fillStyle="#300";

  ctx.fillRect(
    -25,
    -53,
    50,
    5
  );

  ctx.fillStyle="#ff0000";

  ctx.fillRect(
    -25,
    -53,
    50*(e.hp/e.maxHp),
    5
  );


  ctx.restore();

}


/* =========================================================
   MISSILE
========================================================= */

function fireMissile(){

  if(!running)return;

  if(missileCooldown>0)return;

  missileCooldown=.35;

  missiles.push({

    x:player.x,

    y:player.y-65,

    vy:-12

  });

  missileSound();

}


/* =========================================================
   BOMB
========================================================= */

function fireBomb(){

  if(!running)return;

  if(bombCooldown>0)return;

  bombCooldown=1.2;

  bombs.push({

    x:player.x,

    y:player.y-55,

    vy:-6,

    radius:7

  });

  bombSound();

}


/* =========================================================
   EXPLOSION
========================================================= */

function createExplosion(
  x,
  y,
  big=false
){

  explosions.push({

    x:x,

    y:y,

    r:5,

    max:
      big ? 80 : 45,

    life:0,

    maxLife:
      big ? 35 : 24

  });


  const count=
    big ? 30 : 16;


  for(
    let i=0;
    i<count;
    i++
  ){

    const angle=
      Math.random()*
      Math.PI*2;

    const speed=
      1+
      Math.random()*5;


    particles.push({

      x:x,

      y:y,

      vx:
        Math.cos(angle)*speed,

      vy:
        Math.sin(angle)*speed,

      life:
        20+
        Math.random()*25

    });

  }


  explosionSound();

  shake=
    big ? 12 : 6;

}


/* =========================================================
   UPDATE MISSILES
========================================================= */

function updateMissiles(){

  for(
    let i=missiles.length-1;
    i>=0;
    i--
  ){

    const m=
      missiles[i];

    m.y+=m.vy;


    if(m.y<-50){

      missiles.splice(i,1);

      continue;

    }


    /* missile collision */

    for(
      let j=enemies.length-1;
      j>=0;
      j--
    ){

      const e=
        enemies[j];


      if(
        Math.abs(m.x-e.x)<35 &&
        Math.abs(m.y-e.y)<45
      ){

        e.hp-=1;

        createExplosion(
          m.x,
          m.y,
          false
        );

        missiles.splice(i,1);

        hitSound();

        if(e.hp<=0){

          score+=100;

          createExplosion(
            e.x,
            e.y,
            true
          );

          enemies.splice(
            j,
            1
          );

        }

        break;

      }

    }

  }

}


/* =========================================================
   UPDATE BOMBS
========================================================= */

function updateBombs(){

  for(
    let i=bombs.length-1;
    i>=0;
    i--
  ){

    const b=
      bombs[i];

    b.y+=b.vy;


    if(b.y<-50){

      bombs.splice(i,1);

      continue;

    }


    for(
      let j=enemies.length-1;
      j>=0;
      j--
    ){

      const e=
        enemies[j];


      if(
        Math.abs(b.x-e.x)<45 &&
        Math.abs(b.y-e.y)<55
      ){

        const bx=b.x;
        const by=b.y;

        bombs.splice(
          i,
          1
        );

        createExplosion(
          bx,
          by,
          true
        );


        /* bomb damages nearby enemies */

        for(
          let k=enemies.length-1;
          k>=0;
          k--
        ){

          const target=
            enemies[k];

          const dx=
            target.x-bx;

          const dy=
            target.y-by;

          const dist=
            Math.sqrt(
              dx*dx+
              dy*dy
            );


          if(dist<100){

            target.hp-=3;

            if(
              target.hp<=0
            ){

              score+=100;

              createExplosion(
                target.x,
                target.y,
                true
              );

              enemies.splice(
                k,
                1
              );

            }

          }

        }

        break;

      }

    }

  }

}


/* =========================================================
   UPDATE ENEMIES
========================================================= */

function updateEnemies(){

  for(
    let i=enemies.length-1;
    i>=0;
    i--
  ){

    const e=
      enemies[i];

    e.y+=e.speed;


    /* hit player */

    if(
      Math.abs(e.x-player.x)<45 &&
      Math.abs(e.y-player.y)<65
    ){

      player.health-=18;

      createExplosion(
        player.x,
        player.y,
        false
      );

      enemies.splice(
        i,
        1
      );

      hitSound();

      continue;

    }


    /* passed player */

    if(
      e.y>H+100
    ){

      enemies.splice(
        i,
        1
      );

      player.health-=5;

    }

  }

}


/* =========================================================
   PARTICLES
========================================================= */

function updateParticles(){

  for(
    let i=particles.length-1;
    i>=0;
    i--
  ){

    const p=
      particles[i];

    p.x+=p.vx;

    p.y+=p.vy;

    p.vy+=.08;

    p.life--;


    if(p.life<=0){

      particles.splice(
        i,
        1
      );

    }

  }

}


/* =========================================================
   DRAW MISSILES
========================================================= */

function drawMissiles(){

  for(const m of missiles){

    ctx.save();

    ctx.fillStyle="#ff3000";

    ctx.shadowColor="#ff0000";

    ctx.shadowBlur=15;

    ctx.fillRect(
      m.x-3,
      m.y-18,
      6,
      22
    );

    ctx.fillStyle="#fff";

    ctx.fillRect(
      m.x-2,
      m.y-16,
      4,
      10
    );

    ctx.restore();

  }

}


/* =========================================================
   DRAW BOMBS
========================================================= */

function drawBombs(){

  for(const b of bombs){

    ctx.save();

    ctx.fillStyle="#111";

    ctx.strokeStyle="#ff0000";

    ctx.lineWidth=2;

    ctx.shadowColor="red";

    ctx.shadowBlur=12;

    ctx.beginPath();

    ctx.arc(
      b.x,
      b.y,
      8,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.stroke();

    ctx.fillStyle="#ff0000";

    ctx.fillRect(
      b.x-2,
      b.y-13,
      4,
      6
    );

    ctx.restore();

  }

}


/* =========================================================
   DRAW EXPLOSIONS
========================================================= */

function drawExplosions(){

  for(
    const ex of explosions
  ){

    const progress=
      ex.life/ex.maxLife;

    const r=
      ex.r+
      (ex.max-ex.r)*
      progress;


    ctx.save();

    ctx.globalAlpha=
      1-progress;

    ctx.strokeStyle="#ff3300";

    ctx.lineWidth=5;

    ctx.shadowColor="#ff0000";

    ctx.shadowBlur=25;

    ctx.beginPath();

    ctx.arc(
      ex.x,
      ex.y,
      r,
      0,
      Math.PI*2
    );

    ctx.stroke();

    ctx.fillStyle="#ff9900";

    ctx.beginPath();

    ctx.arc(
      ex.x,
      ex.y,
      r*.35,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.restore();

  }

}


/* =========================================================
   UPDATE EXPLOSIONS
========================================================= */

function updateExplosions(){

  for(
    let i=explosions.length-1;
    i>=0;
    i--
  ){

    const ex=
      explosions[i];

    ex.life++;

    if(
      ex.life>=
      ex.maxLife
    ){

      explosions.splice(
        i,
        1
      );

    }

  }

}


/* =========================================================
   DRAW PARTICLES
========================================================= */

function drawParticles(){

  for(const p of particles){

    ctx.save();

    ctx.globalAlpha=
      Math.max(
        0,
        p.life/45
      );

    ctx.fillStyle="#ff3300";

    ctx.fillRect(
      p.x,
      p.y,
      4,
      4
    );

    ctx.restore();

  }

}


/* =========================================================
   TARGET
========================================================= */

function targetScore(){

  return 500+
    (level-1)*250;

}


/* =========================================================
   LEVEL START
========================================================= */

function startLevel(){

  running=true;

  timeLeft=
    LEVEL_TIME;

  levelStart=
    performance.now();

  enemyTimer=0;

  missileCooldown=0;

  bombCooldown=0;

  player.health=100;

  /*
    THIS IS THE FINAL CAR POSITION.
    It cannot be reset down by level start.
  */

  player.y=
    H*.50;

  player.x=
    W/2;


  missiles.length=0;

  bombs.length=0;

  enemies.length=0;

  explosions.length=0;

  particles.length=0;


  document.getElementById(
    "level"
  ).textContent=
    level;


  document.getElementById(
    "targetValue"
  ).textContent=
    targetScore();


  document.getElementById(
    "screen"
  ).classList.add(
    "hidden"
  );


  passSound();

}


/* =========================================================
   PASS LEVEL
========================================================= */

function passLevel(){

  running=false;

  passSound();

  levelMessage=
    "LEVEL "+level+" PASSED!";

  levelMessageTimer=100;

  level++;

  setTimeout(()=>{

    if(levelMessageTimer>=0){

      startLevel();

    }

  },1200);

}


/* =========================================================
   FAIL LEVEL
========================================================= */

function failLevel(){

  running=false;

  failSound();

  levelMessage=
    "LEVEL "+level+" FAILED!";

  levelMessageTimer=100;


  setTimeout(()=>{

    levelMessageTimer=0;

    showGameMessage(
      "LEVEL "+level+" FAILED",
      "TRY AGAIN"
    );

  },700);

}


/* =========================================================
   GAME MESSAGE
========================================================= */

function showGameMessage(
  title,
  button
){

  const screen=
    document.getElementById(
      "screen"
    );

  const panel=
    screen.querySelector(
      ".panel"
    );


  panel.innerHTML=`

    <h1>${title}</h1>

    <h2>SAMEER THAPA</h2>

    <p>
      SCORE: ${score}<br>
      LEVEL: ${level}<br>
      TARGET: ${targetScore()}
    </p>

    <button id="startBtn">
      ${button}
    </button>

  `;


  screen.classList.remove(
    "hidden"
  );


  document.getElementById(
    "startBtn"
  ).onclick=()=>{

    startAudio();

    if(
      audioCtx &&
      audioCtx.state==="suspended"
    ){

      audioCtx.resume();

    }

    startLevel();

  };

}


/* =========================================================
   UPDATE GAME
========================================================= */

function update(dt){

  if(!running)return;


  /* timer */

  const elapsed=
    (performance.now()-
     levelStart)/1000;


  timeLeft=
    Math.max(
      0,
      LEVEL_TIME-elapsed
    );


  /* cooldowns */

  missileCooldown=
    Math.max(
      0,
      missileCooldown-dt
    );

  bombCooldown=
    Math.max(
      0,
      bombCooldown-dt
    );


  /* player movement */

  if(keys.left){

    player.x-=
      player.speed;

  }

  if(keys.right){

    player.x+=
      player.speed;

  }


  /* road limits */

  const roadW=
    Math.min(
      W*.88,
      470
    );

  const roadX=
    (W-roadW)/2;


  player.x=
    Math.max(
      roadX+45,
      Math.min(
        roadX+roadW-45,
        player.x
      )
    );


  /* enemies */

  enemyTimer-=dt;


  const spawnRate=
    Math.max(
      .28,
      1.05-
      level*.025
    );


  if(enemyTimer<=0){

    spawnEnemy();

    enemyTimer=
      spawnRate;

  }


  updateMissiles();

  updateBombs();

  updateEnemies();

  updateParticles();

  updateExplosions();


  if(shake>0){

    shake*=.88;

  }


  /* health */

  if(player.health<=0){

    player.health=0;

    failLevel();

    return;

  }


  /* timer end */

  if(timeLeft<=0){

    if(
      score>=targetScore()
    ){

      passLevel();

    }else{

      failLevel();

    }

  }

}


/* =========================================================
   HUD
========================================================= */

function updateHUD(){

  document.getElementById(
    "level"
  ).textContent=
    level;


  const total=
    Math.ceil(
      timeLeft
    );


  const minutes=
    Math.floor(
      total/60
    );

  const seconds=
    total%60;


  document.getElementById(
    "time"
  ).textContent=
    String(minutes).padStart(2,"0")+
    ":"+
    String(seconds).padStart(2,"0");


  document.getElementById(
    "score"
  ).textContent=
    score;


  document.getElementById(
    "health"
  ).style.width=
    Math.max(
      0,
      player.health
    )+"%";


  document.getElementById(
    "targetValue"
  ).textContent=
    targetScore();

}


/* =========================================================
   DRAW
========================================================= */

function draw(){

  ctx.save();


  if(shake>1){

    ctx.translate(
      (Math.random()-.5)*shake,
      (Math.random()-.5)*shake
    );

  }


  drawRoad();

  drawMissiles();

  drawBombs();


  for(
    const e of enemies
  ){

    drawEnemy(e);

  }


  /*
    PLAYER IS DRAWN LAST.
    So the car is always clearly visible.
  */

  drawPlayer();

  drawExplosions();

  drawParticles();


  ctx.restore();


  /* level message */

  if(
    levelMessageTimer>0
  ){

    levelMessageTimer--;

    ctx.save();

    ctx.fillStyle=
      "rgba(0,0,0,.45)";

    ctx.fillRect(
      0,
      H*.40,
      W,
      100
    );


    ctx.textAlign="center";

    ctx.fillStyle="#ff2222";

    ctx.font=
      "900 30px Arial";

    ctx.shadowColor="red";

    ctx.shadowBlur=20;

    ctx.fillText(
      levelMessage,
      W/2,
      H*.48
    );

    ctx.restore();

  }

}


/* =========================================================
   MAIN LOOP
========================================================= */

function loop(now){

  const dt=
    Math.min(
      .05,
      (now-lastFrame)/1000
    );

  lastFrame=now;

  update(dt);

  draw();

  updateHUD();

  requestAnimationFrame(
    loop
  );

}


/* =========================================================
   BUTTON CONTROLS
========================================================= */

function holdButton(
  element,
  key
){

  element.addEventListener(
    "pointerdown",
    e=>{

      e.preventDefault();

      keys[key]=true;

    }
  );


  element.addEventListener(
    "pointerup",
    e=>{

      e.preventDefault();

      keys[key]=false;

    }
  );


  element.addEventListener(
    "pointercancel",
    ()=>{

      keys[key]=false;

    }
  );


  element.addEventListener(
    "pointerleave",
    ()=>{

      keys[key]=false;

    }
  );

}


holdButton(
  document.getElementById("left"),
  "left"
);


holdButton(
  document.getElementById("right"),
  "right"
);


/* =========================================================
   MISSILE BUTTON
========================================================= */

document.getElementById(
  "missile"
).addEventListener(
  "pointerdown",
  e=>{

    e.preventDefault();

    fireMissile();

  }
);


/* =========================================================
   BOMB BUTTON
========================================================= */

document.getElementById(
  "bomb"
).addEventListener(
  "pointerdown",
  e=>{

    e.preventDefault();

    fireBomb();

  }
);


/* =========================================================
   START GAME
========================================================= */

document.getElementById(
  "startBtn"
).addEventListener(
  "click",
  ()=>{

    startAudio();

    if(
      audioCtx &&
      audioCtx.state==="suspended"
    ){

      audioCtx.resume();

    }

    level=1;

    score=0;

    setPlayerPosition();

    startLevel();

  }
);


/* =========================================================
   INITIALIZE
========================================================= */

resize();

updateHUD();

requestAnimationFrame(
  loop
);

</script>

</body>
      </html>
