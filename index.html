<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width,initial-scale=1.0,
 maximum-scale=1.0,user-scalable=no">

<title>SAMEER THAPA AI BATTLE</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  user-select:none;
  touch-action:none;
}

body{
  overflow:hidden;
  background:#030303;
  font-family:Arial,sans-serif;
}

canvas{
  display:block;
  width:100vw;
  height:100vh;
}

#hud{
  position:fixed;
  top:10px;
  left:0;
  width:100%;
  padding:0 12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  color:white;
  z-index:10;
  pointer-events:none;
}

.name{
  color:#ff2020;
  font-size:13px;
  font-weight:bold;
  text-shadow:0 0 10px red;
}

.level{
  color:#fff;
  font-size:16px;
  font-weight:bold;
}

.timer{
  color:#ff4040;
  font-size:19px;
  font-weight:bold;
}

.score{
  font-size:13px;
}

#healthBox{
  position:fixed;
  top:42px;
  left:50%;
  transform:translateX(-50%);
  width:180px;
  height:10px;
  border:1px solid #ff2020;
  z-index:10;
}

#health{
  width:100%;
  height:100%;
  background:#e60000;
}

#controls{
  position:fixed;
  left:0;
  bottom:17%;
  width:100%;
  padding:0 18px;
  display:flex;
  justify-content:space-between;
  z-index:20;
}

button{
  width:70px;
  height:70px;
  border-radius:50%;
  border:2px solid #ff2222;
  background:rgba(5,5,5,.82);
  color:white;
  font-size:28px;
  box-shadow:
    0 0 12px red,
    inset 0 0 15px #500;
}

button:active{
  transform:scale(.9);
  background:#9c0000;
}

#fire{
  width:82px;
  height:82px;
  font-size:14px;
  font-weight:bold;
}

#bomb{
  width:64px;
  height:64px;
  font-size:12px;
  font-weight:bold;
}

#levelScreen,
#finishScreen,
#adScreen{
  position:fixed;
  inset:0;
  z-index:50;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
  color:white;
  background:rgba(0,0,0,.94);
}

#levelScreen h1,
#finishScreen h1,
#adScreen h1{
  color:#ff2222;
  font-size:38px;
  text-shadow:0 0 20px red;
}

#levelScreen p,
#finishScreen p,
#adScreen p{
  margin-top:12px;
}

#adNumber{
  font-size:52px;
  color:#ff2222;
  margin-top:15px;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
  <div class="name">SAMEER THAPA</div>
  <div class="level">LEVEL <span id="level">1</span></div>
  <div class="timer" id="timer">02:00</div>
  <div class="score">SCORE <span id="score">0</span></div>
</div>

<div id="healthBox">
  <div id="health"></div>
</div>

<div id="controls">
  <button id="left">◀</button>
  <button id="fire">MISSILE</button>
  <button id="bomb">BOMB</button>
  <button id="right">▶</button>
</div>

<div id="levelScreen">
  <h1>LEVEL <span id="levelText">1</span></h1>
  <p>AI BATTLE STARTING...</p>
</div>

<div id="finishScreen">
  <h1>RUN FINISHED</h1>
  <p>LEVEL <span id="finishLevel">1</span></p>
  <p>SCORE <span id="finishScore">0</span></p>
</div>

<div id="adScreen">
  <h1>AD BREAK</h1>
  <div id="adNumber">15</div>
  <p>NEXT BATTLE LOADING...</p>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;

function resize(){
  W=canvas.width=innerWidth;
  H=canvas.height=innerHeight;
}

addEventListener("resize",resize);

/* AUDIO */

let audio=null;

function initAudio(){
  if(audio) return;

  audio=new (window.AudioContext||
             window.webkitAudioContext)();
}

function sound(freq,duration,type="square",volume=.08){

  if(!audio) return;

  const osc=audio.createOscillator();
  const gain=audio.createGain();

  osc.type=type;
  osc.frequency.value=freq;

  gain.gain.setValueAtTime(
    volume,
    audio.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    audio.currentTime+duration
  );

  osc.connect(gain);
  gain.connect(audio.destination);

  osc.start();
  osc.stop(audio.currentTime+duration);
}

function missileSound(){
  sound(180,.08,"sawtooth",.12);

  setTimeout(()=>{
    sound(420,.12,"sawtooth",.1);
  },50);
}

function bombSound(){
  sound(70,.4,"sawtooth",.18);

  setTimeout(()=>{
    sound(35,.5,"square",.15);
  },120);
}

function hitSound(){
  sound(90,.15,"square",.13);
}

/* GAME */

let level=1;
let score=0;

let runStart=0;
const RUN_TIME=120000;

let running=false;

let left=false;
let right=false;

let missiles=[];
let bombs=[];
let enemies=[];
let explosions=[];

let enemyTimer=0;

let player={
  x:W/2,
  y:H-150,
  w:66,
  h:108,
  speed:8,
  health:100
};

/* ROAD */

let roadOffset=0;

function drawRoad(){

  ctx.fillStyle="#030303";
  ctx.fillRect(0,0,W,H);

  const roadW=Math.min(W*.84,440);
  const roadX=(W-roadW)/2;

  ctx.fillStyle="#151515";
  ctx.fillRect(roadX,0,roadW,H);

  ctx.fillStyle="#9d0000";

  ctx.fillRect(roadX,0,5,H);
  ctx.fillRect(roadX+roadW-5,0,5,H);

  ctx.strokeStyle="#444";
  ctx.lineWidth=3;
  ctx.setLineDash([32,32]);

  roadOffset+=7;
  ctx.lineDashOffset=roadOffset;

  for(let i=1;i<3;i++){

    const x=roadX+(roadW/3)*i;

    ctx.beginPath();
    ctx.moveTo(x,0);
    ctx.lineTo(x,H);
    ctx.stroke();
  }

  ctx.setLineDash([]);
}

/* AI CAR */

function drawPlayer(){

  const x=player.x;
  const y=player.y;300

  ctx.save();

  ctx.fillStyle="rgba(0,0,0,.8)";
  ctx.fillRect(x-40,y+48,80,18);

  ctx.fillStyle="#050505";

  ctx.beginPath();
  ctx.moveTo(x-33,y+50);
  ctx.lineTo(x-38,y-20);
  ctx.lineTo(x-25,y-55);
  ctx.lineTo(x+25,y-55);
  ctx.lineTo(x+38,y-20);
  ctx.lineTo(x+33,y+50);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle="#c90000";

  ctx.beginPath();
  ctx.moveTo(x-27,y+45);
  ctx.lineTo(x-31,y-18);
  ctx.lineTo(x-20,y-47);
  ctx.lineTo(x+20,y-47);
  ctx.lineTo(x+31,y-18);
  ctx.lineTo(x+27,y+45);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle="#070707";

  ctx.beginPath();
  ctx.moveTo(x-19,y-38);
  ctx.lineTo(x+19,y-38);
  ctx.lineTo(x+15,y-8);
  ctx.lineTo(x-15,y-8);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle="#ff1111";
  ctx.shadowColor="red";
  ctx.shadowBlur=18;

  ctx.fillRect(x-7,y-25,14,8);

  ctx.fillRect(x-26,y-49,12,6);
  ctx.fillRect(x+14,y-49,12,6);

  ctx.shadowBlur=0;
  ctx.fillStyle="#111";

  ctx.fillRect(x-38,y-5,10,38);
  ctx.fillRect(x+28,y-5,10,38);

  ctx.fillStyle="#ff3000";

  ctx.fillRect(x-38,y+25,10,5);
  ctx.fillRect(x+28,y+25,10,5);

  ctx.fillStyle="#000";

  ctx.fillRect(x-37,y+5,8,31);
  ctx.fillRect(x+29,y+5,8,31);

  ctx.restore();
}

/* ENEMY */

function spawnEnemy(){

  const roadW=Math.min(W*.84,440);
  const roadX=(W-roadW)/2;
  const laneW=roadW/3;

  const lane=Math.floor(Math.random()*3);

  const type=
    Math.random()<.35
    ? "BOSS"
    : "DRONE";

  const hp=
    type==="BOSS"
    ? 3+level
    : 1+Math.floor(level/3);

  enemies.push({
    x:roadX+laneW*lane+laneW/2,
    y:-100,
    w:type==="BOSS"?70:55,
    h:type==="BOSS"?105:85,
    speed:
      type==="BOSS"
      ? 2.5+level*.18
      : 3.5+level*.25,
    hp:hp,
    type:type,
    fireTimer:Math.random()*1500
  });
}

function drawEnemy(e){

  ctx.save();

  const w=e.w;
  const h=e.h;

  ctx.fillStyle="#030303";

  ctx.beginPath();
  ctx.moveTo(e.x-w/2,e.y+h/2);
  ctx.lineTo(e.x-w/2-5,e.y);
  ctx.lineTo(e.x-w/3,e.y-h/2);
  ctx.lineTo(e.x+w/3,e.y-h/2);
  ctx.lineTo(e.x+w/2+5,e.y);
  ctx.lineTo(e.x+w/2,e.y+h/2);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle=
    e.type==="BOSS"
    ? "#730000"
    : "#a00000";

  ctx.fillRect(
    e.x-w/2+7,
    e.y-h/2+10,
    w-14,
    h-20
  );

  ctx.fillStyle="#ff2020";
  ctx.shadowColor="red";
  ctx.shadowBlur=14;

  ctx.fillRect(e.x-20,e.y-25,13,6);
  ctx.fillRect(e.x+7,e.y-25,13,6);

  ctx.fillRect(e.x-6,e.y,12,10);

  if(e.type==="BOSS"){

    ctx.shadowBlur=0;
    ctx.fillStyle="#ff3333";

    ctx.beginPath();
    ctx.moveTo(e.x-30,e.y-45);
    ctx.lineTo(e.x-45,e.y-65);
    ctx.lineTo(e.x-20,e.y-50);
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(e.x+30,e.y-45);
    ctx.lineTo(e.x+45,e.y-65);
    ctx.lineTo(e.x+20,e.y-50);
    ctx.fill();
  }

  ctx.restore();
}

/* MISSILE */

function fireMissile(){

  if(!running) return;

  initAudio();
  missileSound();

  missiles.push({
    x:player.x,
    y:player.y-65,
    speed:14,
    damage:1
  });
}

function drawMissile(m){

  ctx.save();

  ctx.fillStyle="#ff2200";
  ctx.shadowColor="red";
  ctx.shadowBlur=15;

  ctx.fillRect(
    m.x-4,
    m.y-18,
    8,
    25
  );

  ctx.fillStyle="#fff";

  ctx.fillRect(
    m.x-2,
    m.y-21,
    4,
    5
  );

  ctx.fillStyle="#ffb000";

  ctx.fillRect(
    m.x-3,
    m.y+7,
    6,
    14
  );

  ctx.restore();
}

/* BOMB */

function dropBomb(){

  if(!running) return;

  initAudio();
  bombSound();

  bombs.push({
    x:player.x,
    y:player.y-30,
    radius:8,
    speed:9
  });
}

function drawBomb(b){

  ctx.save();

  ctx.fillStyle="#080808";
  ctx.strokeStyle="#ff2020";
  ctx.lineWidth=2;
  ctx.shadowColor="red";
  ctx.shadowBlur=12;

  ctx.beginPath();
  ctx.arc(b.x,b.y,b.radius,0,Math.PI*2);
  ctx.fill();
  ctx.stroke();

  ctx.restore();
}

/* EXPLOSION */

function explosion(x,y,big=false){

  explosions.push({
    x:x,
    y:y,
    r:5,
    max:big?85:50,
    life:25
  });

  hitSound();
}

function drawExplosions(){

  explosions.forEach(e=>{

    e.r+=4;
    e.life--;

    ctx.save();

    ctx.globalAlpha=e.life/25;

    ctx.strokeStyle="#ff2020";
    ctx.lineWidth=7;

    ctx.shadowColor="red";
    ctx.shadowBlur=25;

    ctx.beginPath();
    ctx.arc(
      e.x,
      e.y,
      Math.min(e.r,e.max),
      0,
      Math.PI*2
    );

    ctx.stroke();

    ctx.fillStyle="#ff9d00";

    ctx.beginPath();
    ctx.arc(
      e.x,
      e.y,
      Math.min(e.r*.35,25),
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.restore();
  });

  explosions=
    explosions.filter(e=>e.life>0);
}

/* COLLISION */

function hitEnemy(e,damage){

  e.hp-=damage;

  explosion(e.x,e.y);

  if(e.hp<=0){

    score +=
      e.type==="BOSS"
      ? 100
      : 25;

    explosion(e.x,e.y,true);

    e.dead=true;
  }
}

function updateWeapons(){

  missiles.forEach(m=>{
    m.y-=m.speed;
  });

  bombs.forEach(b=>{
    b.y-=b.speed;
  });

  missiles.forEach(m=>{

    enemies.forEach(e=>{

      if(
        !e.dead &&
        Math.abs(m.x-e.x)<35 &&
        Math.abs(m.y-e.y)<55
      ){

        hitEnemy(e,m.damage);
        m.y=-100;
      }
    });
  });

  bombs.forEach(b=>{

    enemies.forEach(e=>{

      if(
        !e.dead &&
        Math.abs(b.x-e.x)<55 &&
        Math.abs(b.y-e.y)<70
      ){

        hitEnemy(e,3);
        explosion(b.x,b.y,true);
        b.y=-100;
      }
    });
  });

  missiles=
    missiles.filter(m=>m.y>-100);

  bombs=
    bombs.filter(b=>b.y>-100);
}

/* ENEMY MOVEMENT */

function updateEnemies(dt){

  enemies.forEach(e=>{

    e.y+=e.speed;

    e.fireTimer-=dt;

    if(e.fireTimer<=0){

      e.fireTimer=
        1800-Math.min(level*50,800);

      if(
        Math.abs(e.x-player.x)<45 &&
        Math.abs(e.y-player.y)<400
      ){

        player.health-=
          e.type==="BOSS"
          ? 8
          : 3;

        explosion(player.x,player.y);
      }
    }

    if(
      !e.dead &&
      Math.abs(e.x-player.x)<45 &&
      Math.abs(e.y-player.y)<75
    ){

      player.health-=
        e.type==="BOSS"
        ? 18
        : 8;

      e.dead=true;

      explosion(
        player.x,
        player.y,
        true
      );
    }
  });

  enemies=
    enemies.filter(
      e=>!e.dead && e.y<H+150
    );
}

/* PLAYER */

function updatePlayer(){

  if(left) player.x-=player.speed;
  if(right) player.x+=player.speed;

  const roadW=Math.min(W*.84,440);
  const roadX=(W-roadW)/2;

  player.x=Math.max(
    roadX+42,
    Math.min(
      roadX+roadW-42,
      player.x
    )
  );
}

/* LEVEL */

function updateLevel(now){

  const elapsed=now-runStart;

  const remaining=
    Math.max(0,RUN_TIME-elapsed);

  const sec=Math.ceil(remaining/1000);

  const min=Math.floor(sec/60);
  const s=sec%60;

  document.getElementById("timer")
    .textContent=
      String(min).padStart(2,"0")+
      ":"+
      String(s).padStart(2,"0");

  document.getElementById("score")
    .textContent=score;

  document.getElementById("level")
    .textContent=level;

  document.getElementById("health")
    .style.width=
      Math.max(0,player.health)+"%";

  return remaining;
}

/* MAIN LOOP */

let last=0;

function loop(now){

  if(!running) return;

  const dt=now-last||16;
  last=now;

  ctx.clearRect(0,0,W,H);

  drawRoad();

  updatePlayer();

  enemyTimer+=dt;

  const spawnRate=
    Math.max(
      400,
      1150-level*35
    );

  if(enemyTimer>spawnRate){

    spawnEnemy();
    enemyTimer=0;

    if(level>=5 && Math.random()<.25){
      setTimeout(spawnEnemy,100);
    }
  }

  updateEnemies(dt);
  updateWeapons();

  missiles.forEach(drawMissile);
  bombs.forEach(drawBomb);

  drawPlayer();
  enemies.forEach(drawEnemy);

  drawExplosions();

  const remaining=updateLevel(now);

  if(player.health<=0){

    finishRun();
    return;
  }

  if(remaining<=0){

    finishRun();
    return;
  }

  requestAnimationFrame(loop);
}

/* RUN / AD */

function startRun(){

  player.health=100;

  missiles=[];
  bombs=[];
  enemies=[];
  explosions=[];

  runStart=performance.now();
  last=performance.now();

  running=true;

  document.getElementById("level")
    .textContent=level;

  document.getElementById("levelScreen")
    .style.display="none";

  document.getElementById("finishScreen")
    .style.display="none";

  document.getElementById("adScreen")
    .style.display="none";

  requestAnimationFrame(loop);
}

function finishRun(){

  if(!running) return;

  running=false;

  document.getElementById("finishLevel")
    .textContent=level;

  document.getElementById("finishScore")
    .textContent=score;

  document.getElementById("finishScreen")
    .style.display="flex";

  setTimeout(showAd,1200);
}

function showAd(){

  document.getElementById("finishScreen")
    .style.display="none";

  document.getElementById("adScreen")
    .style.display="flex";

  let n=15;

  document.getElementById("adNumber")
    .textContent=n;

  const adTimer=setInterval(()=>{

    n--;

    document.getElementById("adNumber")
      .textContent=n;

    if(n<=0){

      clearInterval(adTimer);

      level++;

      document.getElementById("levelText")
        .textContent=level;

      document.getElementById("levelScreen")
        .style.display="flex";

      setTimeout(startRun,1000);
    }

  },1000);
}

/* BUTTONS */

function hold(button,down,up){

  button.addEventListener(
    "pointerdown",
    e=>{
      e.preventDefault();
      initAudio();
      down();
    }
  );

  button.addEventListener(
    "pointerup",
    e=>{
      e.preventDefault();
      up();
    }
  );

  button.addEventListener(
    "pointercancel",
    up
  );

  button.addEventListener(
    "pointerleave",
    up
  );
}

hold(
  document.getElementById("left"),
  ()=>left=true,
  ()=>left=false
);

hold(
  document.getElementById("right"),
  ()=>right=true,
  ()=>right=false
);

document.getElementById("fire")
  .addEventListener("pointerdown",e=>{
    e.preventDefault();
    initAudio();
    fireMissile();
  });

document.getElementById("bomb")
  .addEventListener("pointerdown",e=>{
    e.preventDefault();
    initAudio();
    dropBomb();
  });

/* KEYBOARD */

addEventListener("keydown",e=>{

  if(e.key==="ArrowLeft") left=true;
  if(e.key==="ArrowRight") right=true;

  if(e.key===" ") fireMissile();

  if(e.key.toLowerCase()==="b")
    dropBomb();
});

addEventListener("keyup",e=>{

  if(e.key==="ArrowLeft") left=false;
  if(e.key==="ArrowRight") right=false;
});

/* START */

resize();

document.getElementById("levelScreen")
  .style.display="flex";

setTimeout(startRun,1200);

</script>

</body>
</html>
