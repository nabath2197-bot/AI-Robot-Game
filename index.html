<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>MS-MS ROBOT</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#02050b;color:white;font-family:Arial}
canvas{position:fixed;inset:0;width:100%;height:100%}

#hud{
 position:fixed;top:8px;left:7px;right:7px;z-index:10;
 display:flex;justify-content:space-between;gap:4px
}
.h{
 background:#071523eF;border:1px solid #00eaff;border-radius:8px;
 padding:5px 7px;text-align:center;font-size:10px;min-width:65px
}
.h b{display:block;font-size:15px;color:#00ffcc}

#name{
 position:fixed;top:55px;left:50%;transform:translateX(-50%);
 z-index:10;background:#061321;border:1px solid #00eaff;
 border-radius:20px;padding:5px 16px;font-size:13px
}

#mission{
 position:fixed;top:86px;left:50%;transform:translateX(-50%);
 width:calc(100% - 20px);max-width:390px;z-index:20;
 background:#160d00F2;border:2px solid #ffca00;
 border-radius:12px;text-align:center;padding:8px;
 box-shadow:0 0 15px #ffb00066
}
#missionTitle{color:#ffd000;font-weight:bold;font-size:14px}
#missionTarget{font-size:13px;margin-top:3px}
#missionKills{font-size:16px;margin-top:3px}
#kills{color:#00ff88;font-size:20px}
#target{color:#ffd000;font-size:20px}
#remaining{
 margin-top:4px;padding:4px;border-radius:7px;
 background:#ffbd0018;font-weight:bold;font-size:13px
}
#remaining b{color:#ffd000;font-size:18px}

#energyBox{
 position:fixed;top:157px;left:10px;right:10px;height:13px;
 z-index:15;border:1px solid #00eaff;border-radius:20px;overflow:hidden;
 background:#07101a
}
#energy{height:100%;width:100%;background:#00ff99}

#message{
 position:fixed;top:180px;left:50%;transform:translateX(-50%);
 z-index:25;font-size:18px;font-weight:bold;text-align:center;
 text-shadow:0 0 10px #00eaff;pointer-events:none
}

#start,#over,#complete{
 position:fixed;inset:0;z-index:100;
 display:flex;align-items:center;justify-content:center;
 flex-direction:column;text-align:center;background:#02040af5
}
#over,#complete{display:none}

.title{
 color:#00eaff;font-size:34px;font-weight:bold;
 text-shadow:0 0 20px #00eaff;margin-bottom:8px
}
.sub{color:#aaa;margin-bottom:20px}

input{
 width:270px;max-width:90%;padding:13px;margin-bottom:12px;
 border-radius:10px;border:2px solid #00eaff;
 background:#050b14;color:white;text-align:center;font-size:17px
}
.btn{
 padding:13px 28px;border-radius:12px;border:2px solid #00eaff;
 background:#062033;color:white;font-size:17px;font-weight:bold
}

#controls{
 position:fixed;left:0;right:0;bottom:48px;z-index:60;
 display:flex;justify-content:center;gap:9px
}
.ctrl{
 width:68px;height:54px;border-radius:13px;
 border:2px solid #00eaff;background:#061827dd;
 color:white;font-size:24px
}
.fire{border-color:#ff4040;background:#390808dd}
.bomb{border-color:#ffb000;background:#382000dd}

#adSpace{
 position:fixed;bottom:4px;left:50%;transform:translateX(-50%);
 z-index:50;color:#555;font-size:9px;
}

.big{font-size:38px;color:#00ff99;font-weight:bold}
.levelText{font-size:22px;margin:12px 0 18px}

@media(max-height:650px){
 #mission{top:78px;padding:6px}
 #energyBox{top:143px}
 #message{top:164px}
 #controls{bottom:34px}
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
 <div class="h">LEVEL<b id="level">1</b></div>
 <div class="h">SCORE<b id="score">0</b></div>
 <div class="h">TIME<b id="time">05:00</b></div>
 <div class="h">KILLS<b id="hkills">0</b></div>
</div>

<div id="name">PLAYER</div>

<div id="mission">
 <div id="missionTitle">🎯 CURRENT MISSION TARGET</div>
 <div id="missionTarget">
  DESTROY <span id="target">10</span> ENEMIES
 </div>
 <div id="missionKills">
  KILLS: <span id="kills">0</span> / <span id="target2">10</span>
 </div>
 <div id="remaining">
  <b id="leftKills">10</b> MORE KILLS → NEXT LEVEL
 </div>
</div>

<div id="energyBox"><div id="energy"></div></div>
<div id="message"></div>

<div id="start">
 <div class="title">MS-MS ROBOT</div>
 <div class="sub">FUTURISTIC AI BATTLE</div>
 <input id="playerInput" maxlength="15" placeholder="ENTER PLAYER NAME">
 <button class="btn" onclick="startGame()">▶ START MISSION</button>
</div>

<div id="over">
 <div class="title">GAME OVER</div>
 <div id="final"></div>
 <br>
 <button class="btn" onclick="restart()">🔄 PLAY AGAIN</button>
</div>

<div id="complete">
 <div class="big">LEVEL COMPLETE!</div>
 <div class="levelText" id="completeText"></div>
 <button class="btn" onclick="nextLevel()">🚀 NEXT LEVEL</button>
</div>

<div id="controls">
 <button class="ctrl" id="left">◀</button>
 <button class="ctrl fire" id="fire">🔫</button>
 <button class="ctrl bomb">💣</button>
 <button class="ctrl" id="right">▶</button>
</div>

<!-- AD SPACE: LATER CONNECT ADMOB HERE -->
<div id="adSpace">AD SPACE • READY FOR ADMOB</div>

<script>
const c=document.getElementById("game");
const x=c.getContext("2d");

let W,H;
function resize(){
 W=c.width=innerWidth;
 H=c.height=innerHeight;
 if(player)player.y=H-225;
}
addEventListener("resize",resize);

let player={
 x:innerWidth/2,y:innerHeight-225,
 w:42,h:48,speed:6
};

let running=false;
let level=1;
let score=0;
let kills=0;
let targetKills=10;
let time=300;
let power=100;

let left=false,right=false;
let bullets=[];
let enemies=[];
let crystals=[];
let explosions=[];
let stars=[];

let spawn=0;
let crystalSpawn=4;
let shootWait=0;
let last=0;

for(let i=0;i<100;i++){
 stars.push({
  x:Math.random()*innerWidth,
  y:Math.random()*innerHeight,
  s:Math.random()*2+.5
 });
}

resize();

let audio=null;

function beep(f,d=.1){
 try{
  audio=audio||new(window.AudioContext||window.webkitAudioContext)();
  let o=audio.createOscillator();
  let g=audio.createGain();
  o.frequency.value=f;
  g.gain.value=.06;
  o.connect(g);g.connect(audio.destination);
  o.start();
  g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);
  o.stop(audio.currentTime+d);
 }catch(e){}
}

function hud(){
 document.getElementById("level").textContent=level;
 document.getElementById("score").textContent=score;
 document.getElementById("hkills").textContent=kills;
 document.getElementById("kills").textContent=kills;
 document.getElementById("target").textContent=targetKills;
 document.getElementById("target2").textContent=targetKills;
 document.getElementById("leftKills").textContent=
  Math.max(0,targetKills-kills);

 let m=Math.floor(time/60);
 let s=Math.floor(time%60);
 document.getElementById("time").textContent=
  String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");

 document.getElementById("energy").style.width=
  Math.max(0,power)+"%";
}

function startGame(){
 let n=document.getElementById("playerInput").value.trim();
 document.getElementById("name").textContent=n||"PLAYER";

 level=1;
 score=0;
 kills=0;
 targetKills=10;
 time=300;
 power=100;

 bullets=[];
 enemies=[];
 crystals=[];
 explosions=[];

 document.getElementById("start").style.display="none";

 running=true;
 beep(500,.2);
 hud();
 requestAnimationFrame(loop);
}

function restart(){
 document.getElementById("over").style.display="none";
 startGame();
}

function nextLevel(){
 document.getElementById("complete").style.display="none";

 level++;
 kills=0;
 targetKills=Math.min(100,10+(level-1)*5);
 time=300;
 power=100;
 enemies=[];
 bullets=[];
 crystals=[];

 running=true;
 hud();
}

function spawnEnemy(){
 let hunter=Math.random()<.25;

 enemies.push({
  x:25+Math.random()*(W-50),
  y:-40,
  w:hunter?46:34,
  h:hunter?46:34,
  speed:(hunter?2.5:1.5)+level*.08,
  hp:hunter?2:1,
  hunter:hunter,
  a:Math.random()*6
 });
}

function spawnCrystal(){
 crystals.push({
  x:25+Math.random()*(W-50),
  y:-20,
  speed:1.5
 });
}

function shoot(){
 if(!running||shootWait>0)return;

 shootWait=.16;

 bullets.push({
  x:player.x,
  y:player.y-35,
  speed:10
 });

 beep(700,.07);
}

function bomb(){
 if(!running)return;

 beep(120,.25);

 explosions.push({
  x:player.x,
  y:player.y,
  r:5
 });
}

function killEnemy(i){
 let e=enemies[i];

 score+=e.hunter?25:10;
 kills++;

 for(let n=0;n<15;n++){
  explosions.push({
   x:e.x,
   y:e.y,
   r:Math.random()*5+2
  });
 }

 enemies.splice(i,1);
 beep(100,.18);

 if(kills>=targetKills){
  running=false;
  document.getElementById("completeText").textContent=
   "LEVEL "+level+" COMPLETE — NEXT LEVEL "+(level+1);
  document.getElementById("complete").style.display="flex";
 }

 hud();
}

function update(dt){
 if(!running)return;

 time-=dt;

 if(time<=0){
  time=0;
  running=false;
  document.getElementById("final").textContent=
   "SCORE "+score+" • LEVEL "+level+" • KILLS "+kills;
  document.getElementById("over").style.display="flex";
 }

 if(left)player.x-=player.speed;
 if(right)player.x+=player.speed;

 player.x=Math.max(25,Math.min(W-25,player.x));

 shootWait-=dt;

 spawn-=dt;

 if(spawn<=0){
  spawnEnemy();
  spawn=Math.max(.35,1.1-level*.025);
 }

 crystalSpawn-=dt;

 if(crystalSpawn<=0){
  spawnCrystal();
  crystalSpawn=5;
 }

 for(let i=bullets.length-1;i>=0;i--){
  let b=bullets[i];
  b.y-=b.speed;

  if(b.y<0){
   bullets.splice(i,1);
   continue;
  }

  for(let j=enemies.length-1;j>=0;j--){
   let e=enemies[j];

   if(Math.abs(b.x-e.x)<e.w &&
      Math.abs(b.y-e.y)<e.h){

    e.hp--;
    bullets.splice(i,1);

    if(e.hp<=0)killEnemy(j);
    break;
   }
  }
 }

 for(let i=enemies.length-1;i>=0;i--){
  let e=enemies[i];

  e.y+=e.speed;
  e.a+=.05;

  if(e.hunter)e.x+=Math.sin(e.a)*1.5;

  if(Math.abs(e.x-player.x)<35 &&
     Math.abs(e.y-player.y)<45){

   power-=e.hunter?15:8;
   enemies.splice(i,1);
   beep(70,.2);

   if(power<=0){
    power=0;
    running=false;
    document.getElementById("final").textContent=
     "ENERGY EMPTY • SCORE "+score+" • KILLS "+kills;
    document.getElementById("over").style.display="flex";
   }

   continue;
  }

  if(e.y>H+60){
   enemies.splice(i,1);
   power-=2;
  }
 }

 for(let i=crystals.length-1;i>=0;i--){
  let q=crystals[i];
  q.y+=q.speed;

  if(Math.abs(q.x-player.x)<35 &&
     Math.abs(q.y-player.y)<45){

   power=Math.min(100,power+20);
   score+=5;
   crystals.splice(i,1);
   beep(900,.12);
   continue;
  }

  if(q.y>H+30)crystals.splice(i,1);
 }

 for(let i=explosions.length-1;i>=0;i--){
  let e=explosions[i];
  e.r+=7;

  for(let j=enemies.length-1;j>=0;j--){
   let q=enemies[j];
   let dx=q.x-e.x;
   let dy=q.y-e.y;

   if(Math.sqrt(dx*dx+dy*dy)<e.r){
    killEnemy(j);
   }
  }

  if(e.r>170)explosions.splice(i,1);
 }

 for(let s of stars){
  s.y+=s.s;
  if(s.y>H)s.y=0;
 }

 hud();
}

function draw(){
 x.clearRect(0,0,W,H);

 x.fillStyle="#02050b";
 x.fillRect(0,0,W,H);

 x.fillStyle="#789";
 for(let s of stars)x.fillRect(s.x,s.y,s.s,s.s);

 /* GRID */
 x.strokeStyle="rgba(0,200,255,.07)";

 for(let gx=0;gx<W;gx+=40){
  x.beginPath();
  x.moveTo(gx,210);
  x.lineTo(gx,H);
  x.stroke();
 }

 for(let gy=210;gy<H;gy+=40){
  x.beginPath();
  x.moveTo(0,gy);
  x.lineTo(W,gy);
  x.stroke();
 }

 /* ENERGY CRYSTALS */
 for(let q of crystals){
  x.fillStyle="#00ffcc";
  x.shadowBlur=18;
  x.shadowColor="#00ffcc";
  x.beginPath();
  x.moveTo(q.x,q.y-10);
  x.lineTo(q.x+10,q.y);
  x.lineTo(q.x,q.y+10);
  x.lineTo(q.x-10,q.y);
  x.closePath();
  x.fill();
 }

 x.shadowBlur=0;

 /* BULLETS */
 for(let b of bullets){
  x.fillStyle="#ffff00";
  x.fillRect(b.x-3,b.y-12,6,18);
 }

 /* ENEMIES */
 for(let e of enemies){
  x.save();
  x.translate(e.x,e.y);
  x.rotate(Math.sin(e.a)*.15);

  if(e.hunter){
   x.fillStyle="#ff1744";
   x.shadowBlur=18;
   x.shadowColor="#ff0033";
   x.beginPath();
   x.moveTo(0,-25);
   x.lineTo(25,15);
   x.lineTo(0,25);
   x.lineTo(-25,15);
   x.closePath();
   x.fill();
  }else{
   x.fillStyle="#8a00ff";
   x.shadowBlur=15;
   x.shadowColor="#aa00ff";
   x.fillRect(-17,-17,34,34);
   x.fillStyle="#ff3030";
   x.fillRect(-6,-6,12,12);
  }

  x.restore();
  x.shadowBlur=0;
 }

 /* EXPLOSIONS */
 for(let e of explosions){
  x.beginPath();
  x.arc(e.x,e.y,e.r,0,Math.PI*2);
  x.strokeStyle="#ff9d00";
  x.lineWidth=3;
  x.stroke();
 }

 /* ROBOT */
 x.save();
 x.translate(player.x,player.y);

 x.shadowBlur=18;
 x.shadowColor="#00eaff";

 x.fillStyle="#0c6a88";
 x.fillRect(-20,-15,40,38);

 x.fillStyle="#1cb9d8";
 x.fillRect(-17,-40,34,25);

 x.fillStyle="#ff304f";
 x.fillRect(-11,-32,7,5);
 x.fillRect(4,-32,7,5);

 x.fillStyle="#00ffcc";
 x.fillRect(-8,-5,16,14);

 x.fillStyle="#15536c";
 x.fillRect(-30,-10,10,25);
 x.fillRect(20,-10,10,25);

 x.fillRect(-15,22,10,19);
 x.fillRect(5,22,10,19);

 x.restore();
}

function loop(t){
 if(!last)t=last||t;
 let dt=Math.min(.1,(t-(last||t))/1000);
 last=t;

 update(dt);
 draw();

 requestAnimationFrame(loop);
}

/* MOBILE BUTTONS */

function hold(id,down,up){
 let b=document.getElementById(id);

 b.addEventListener("touchstart",e=>{
  e.preventDefault();
  down();
 },{passive:false});

 b.addEventListener("touchend",e=>{
  e.preventDefault();
  up();
 },{passive:false});

 b.addEventListener("mousedown",down);
 b.addEventListener("mouseup",up);
}

hold("left",
 ()=>left=true,
 ()=>left=false);

hold("right",
 ()=>right=true,
 ()=>right=false);

document.getElementById("fire")
.addEventListener("touchstart",e=>{
 e.preventDefault();
 shoot();
},{passive:false});

document.getElementById("fire")
.addEventListener("mousedown",shoot);

document.querySelector(".bomb")
.addEventListener("touchstart",e=>{
 e.preventDefault();
 bomb();
},{passive:false});

document.querySelector(".bomb")
.addEventListener("mousedown",bomb);

document.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft")left=true;
 if(e.key==="ArrowRight")right=true;
 if(e.key===" ")shoot();
 if(e.key.toLowerCase()==="b")bomb();
});

document.addEventListener("keyup",e=>{
 if(e.key==="ArrowLeft")left=false;
 if(e.key==="ArrowRight")right=false;
});

draw();
</script>

</body>
</html>
