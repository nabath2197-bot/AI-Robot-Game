<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>SAMEER THAPA - AI BATTLE</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  touch-action:none;
  user-select:none;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#020307;
  font-family:Arial,sans-serif;
}

#game{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  background:#020307;
}

#hud{
  position:fixed;
  top:8px;
  left:8px;
  right:8px;
  z-index:20;
  color:white;
  text-align:center;
  pointer-events:none;
}

#name{
  font-size:18px;
  font-weight:900;
  letter-spacing:3px;
  color:#ff3030;
  text-shadow:0 0 10px #ff0000;
}

#stats{
  margin-top:5px;
  display:flex;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
}

.box{
  background:rgba(0,0,0,.65);
  border:1px solid rgba(255,40,40,.55);
  border-radius:8px;
  padding:5px 9px;
  font-size:12px;
  font-weight:bold;
}

#screen{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,.72);
  padding:20px;
}

#screen.hidden{
  display:none;
}

.panel{
  width:min(420px,94vw);
  padding:28px 20px;
  border-radius:18px;
  text-align:center;
  background:
    linear-gradient(145deg,#11151d,#050609);
  border:2px solid #ff2525;
  box-shadow:
    0 0 25px rgba(255,0,0,.45),
    inset 0 0 25px rgba(255,0,0,.08);
  color:white;
}

.panel h1{
  font-size:28px;
  color:#ff3030;
  letter-spacing:3px;
  text-shadow:0 0 15px red;
}

.panel h2{
  margin-top:10px;
  font-size:22px;
}

.panel p{
  margin-top:10px;
  line-height:1.5;
  color:#ccc;
}

#startBtn{
  margin-top:22px;
  width:100%;
  padding:15px;
  border:0;
  border-radius:10px;
  color:white;
  background:linear-gradient(90deg,#8b0000,#ff1717,#8b0000);
  font-size:18px;
  font-weight:900;
  box-shadow:0 0 18px rgba(255,0,0,.5);
}

#controls{
  position:fixed;
  left:0;
  right:0;
  bottom:12px;
  height:78px;
  z-index:40;
  pointer-events:none;
}

.btn{
  position:absolute;
  bottom:0;
  height:68px;
  border-radius:15px;
  border:2px solid rgba(255,255,255,.25);
  color:white;
  font-size:12px;
  font-weight:900;
  background:rgba(10,12,18,.88);
  box-shadow:
    0 0 15px rgba(255,0,0,.18),
    inset 0 0 12px rgba(255,0,0,.08);
  pointer-events:auto;
}

.btn:active{
  transform:scale(.94);
  background:#380909;
}

#left{
  left:12px;
  width:65px;
}

#right{
  left:84px;
  width:65px;
}

#missile{
  right:84px;
  width:82px;
}

#bomb{
  right:8px;
  width:68px;
}

.small{
  display:block;
  margin-top:2px;
  font-size:9px;
  color:#aaa;
}

#flash{
  position:fixed;
  inset:0;
  z-index:80;
  pointer-events:none;
  background:white;
  opacity:0;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
  <div id="name">SAMEER THAPA</div>

  <div id="stats">
    <div class="box">LEVEL <span id="level">1</span></div>
    <div class="box">TIME <span id="time">120</span></div>
    <div class="box">SCORE <span id="score">0</span></div>
    <div class="box">TARGET <span id="target">500</span></div>
    <div class="box">HP <span id="hp">100</span></div>
  </div>
</div>

<div id="flash"></div>

<div id="controls">

  <button class="btn" id="left">
    ◀
    <span class="small">MOVE</span>
  </button>

  <button class="btn" id="right">
    ▶
    <span class="small">MOVE</span>
  </button>

  <button class="btn" id="missile">
    🚀 MISSILE
    <span class="small">FIRE</span>
  </button>

  <button class="btn" id="bomb">
    💣 BOMB
    <span class="small">FIRE</span>
  </button>

</div>

<div id="screen">

  <div class="panel">

    <h1>AI BATTLE</h1>

    <h2 id="screenTitle">SAMEER THAPA</h2>

    <p id="screenText">
      Enter the futuristic AI battlefield.<br>
      Survive for 2 minutes and reach the target score.
    </p>

    <button id="startBtn">START BATTLE</button>

  </div>

</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = 0;
let H = 0;

/* =========================================================
   ONE CAR POSITION SETTING
   0.50 = higher
   0.58 = lower
   0.62 = even lower
   ========================================================= */

const CAR_Y = 0.58;


/* =========================================================
   GAME SETTINGS
   ========================================================= */

const LEVEL_TIME = 120;

let level = 1;
let score = 0;
let timeLeft = LEVEL_TIME;

let running = false;

let lastTime = performance.now();
let levelStart = performance.now();

let enemyTimer = 0;
let missileCooldown = 0;
let bombCooldown = 0;

let moveLeft = false;
let moveRight = false;


/* =========================================================
   PLAYER
   ========================================================= */

const player = {
  x:0,
  y:0,

  w:82,
  h:120,

  speed:8,

  health:100
};


/* =========================================================
   OBJECT ARRAYS
   ========================================================= */

const missiles = [];
const bombs = [];
const enemies = [];
const explosions = [];
const particles = [];


/* =========================================================
   UI
   ========================================================= */

const levelEl = document.getElementById("level");
const timeEl = document.getElementById("time");
const scoreEl = document.getElementById("score");
const targetEl = document.getElementById("target");
const hpEl = document.getElementById("hp");

const screen = document.getElementById("screen");
const screenTitle = document.getElementById("screenTitle");
const screenText = document.getElementById("screenText");
const startBtn = document.getElementById("startBtn");

const flash = document.getElementById("flash");


/* =========================================================
   RESIZE
   ========================================================= */

function setPlayerPosition(){

  player.x = W / 2;

  /* ONLY ONE CAR Y POSITION */
  player.y = H * CAR_Y;
}


function resize(){

  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;

  setPlayerPosition();
}

window.addEventListener("resize",resize);

resize();


/* =========================================================
   SOUND
   ========================================================= */

let audioCtx = null;

function audioStart(){

  if(!audioCtx){

    audioCtx =
      new (window.AudioContext ||
      window.webkitAudioContext)();
  }

  if(audioCtx.state === "suspended"){
    audioCtx.resume();
  }
}


function sound(freq,duration,type="sawtooth",volume=.04){

  try{

    audioStart();

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = type;
    osc.frequency.value = freq;

    gain.gain.setValueAtTime(
      volume,
      audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      .001,
      audioCtx.currentTime + duration
    );

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();

    osc.stop(
      audioCtx.currentTime + duration
    );

  }catch(e){}
}


function missileSound(){

  sound(900,.08,"square",.05);

  setTimeout(()=>{
    sound(1300,.08,"square",.04);
  },50);
}


function bombSound(){

  sound(100,.35,"sawtooth",.08);

  setTimeout(()=>{
    sound(55,.45,"sine",.06);
  },100);
}


function hitSound(){

  sound(180,.12,"square",.06);
}


function passSound(){

  sound(500,.12,"square",.05);

  setTimeout(()=>{
    sound(800,.15,"square",.05);
  },130);

  setTimeout(()=>{
    sound(1100,.2,"square",.05);
  },280);
}


/* =========================================================
   TARGET
   ========================================================= */

function targetScore(){

  return 500 + (level - 1) * 250;
}


/* =========================================================
   START LEVEL
   ========================================================= */

function startLevel(){

  running = true;

  timeLeft = LEVEL_TIME;

  levelStart = performance.now();

  enemyTimer = 0;

  missileCooldown = 0;
  bombCooldown = 0;

  player.health = 100;

  /* FIXED CAR POSITION */
  player.x = W / 2;
  player.y = H * CAR_Y;

  missiles.length = 0;
  bombs.length = 0;
  enemies.length = 0;
  explosions.length = 0;
  particles.length = 0;

  levelEl.textContent = level;

  targetEl.textContent = targetScore();

  timeEl.textContent = LEVEL_TIME;

  hpEl.textContent = 100;

  screen.classList.add("hidden");

  passSound();
}


/* =========================================================
   RANDOM
   ========================================================= */

function random(min,max){

  return Math.random() * (max-min) + min;
}


/* =========================================================
   ENEMY SPAWN
   ========================================================= */

function spawnEnemy(){

  const size = random(52,76);

  const hp =
    30 +
    level * 8;

  enemies.push({

    x:random(60,W-60),

    y:-100,

    w:size,
    h:size*1.45,

    speed:
      random(2.0,3.5) +
      level*.08,

    hp:hp,

    maxHp:hp,

    type:
      Math.random() < .5 ? 1 : 2
  });
}


/* =========================================================
   MISSILE
   ========================================================= */

function fireMissile(){

  if(!running) return;

  if(missileCooldown > 0) return;

  missileCooldown = .28;

  missiles.push({

    x:player.x,

    y:player.y-55,

    speed:13,

    damage:35 + level*3
  });

  missileSound();

  for(let i=0;i<5;i++){

    particles.push({

      x:player.x,

      y:player.y-50,

      vx:random(-1,1),

      vy:random(1,3),

      life:.4,

      size:random(2,5),

      type:"fire"
    });
  }
}


/* =========================================================
   BOMB
   ========================================================= */

function fireBomb(){

  if(!running) return;

  if(bombCooldown > 0) return;

  bombCooldown = 1;

  bombs.push({

    x:player.x,

    y:player.y-40,

    speed:7,

    radius:35,

    damage:70 + level*5
  });

  bombSound();
}


/* =========================================================
   EXPLOSION
   ========================================================= */

function explode(x,y,big=false){

  explosions.push({

    x:x,

    y:y,

    r:5,

    max:big ? 100 : 55,

    life:.6
  });

  for(let i=0;i<(big?35:18);i++){

    particles.push({

      x:x,

      y:y,

      vx:random(-5,5),

      vy:random(-5,5),

      life:random(.3,.8),

      size:random(2,6),

      type:"fire"
    });
  }

  sound(
    big ? 70 : 130,
    big ? .35 : .18,
    "sawtooth",
    big ? .09 : .05
  );
}


/* =========================================================
   PLAYER DAMAGE
   ========================================================= */

function damagePlayer(amount){

  if(!running) return;

  player.health -= amount;

  if(player.health < 0){
    player.health = 0;
  }

  hpEl.textContent =
    Math.floor(player.health);

  hitSound();

  flash.style.opacity = ".35";

  setTimeout(()=>{
    flash.style.opacity = "0";
  },80);

  if(player.health <= 0){

    failLevel("AI CAR DESTROYED");
  }
}


/* =========================================================
   COLLISION
   ========================================================= */

function collision(a,b){

  return (

    a.x-a.w/2 < b.x+b.w/2 &&

    a.x+a.w/2 > b.x-b.w/2 &&

    a.y-a.h/2 < b.y+b.h/2 &&

    a.y+a.h/2 > b.y-b.h/2
  );
}


/* =========================================================
   UPDATE
   ========================================================= */

function update(dt){

  if(!running) return;

  missileCooldown -= dt;
  bombCooldown -= dt;

  if(missileCooldown < 0)
    missileCooldown = 0;

  if(bombCooldown < 0)
    bombCooldown = 0;


  /* -----------------------------------------
     PLAYER MOVEMENT
     ----------------------------------------- */

  if(moveLeft){

    player.x -= player.speed;
  }

  if(moveRight){

    player.x += player.speed;
  }

  player.x = Math.max(
    48,
    Math.min(W-48,player.x)
  );

  /* IMPORTANT:
     player.y is NOT changed here.
     So the car stays at one fixed position.
  */


  /* -----------------------------------------
     ENEMY SPAWN
     ----------------------------------------- */

  enemyTimer += dt;

  const spawnRate =
    Math.max(.28,1.0-level*.025);

  if(enemyTimer >= spawnRate){

    enemyTimer = 0;

    spawnEnemy();

    if(Math.random()<.18){
      spawnEnemy();
    }
  }


  /* -----------------------------------------
     MISSILES
     ----------------------------------------- */

  for(let i=missiles.length-1;i>=0;i--){

    const m = missiles[i];

    m.y -= m.speed;

    if(m.y < -50){

      missiles.splice(i,1);

      continue;
    }


    for(let j=enemies.length-1;j>=0;j--){

      const e = enemies[j];

      const dx = m.x-e.x;
      const dy = m.y-e.y;

      const distance =
        Math.sqrt(dx*dx+dy*dy);

      if(distance < e.w*.7){

        e.hp -= m.damage;

        explode(m.x,m.y,false);

        missiles.splice(i,1);

        if(e.hp <= 0){

          score += 100 + level*15;

          explode(e.x,e.y,true);

          enemies.splice(j,1);
        }

        break;
      }
    }
  }


  /* -----------------------------------------
     BOMBS
     ----------------------------------------- */

  for(let i=bombs.length-1;i>=0;i--){

    const b = bombs[i];

    b.y -= b.speed;

    if(b.y < -80){

      bombs.splice(i,1);

      continue;
    }


    for(let j=enemies.length-1;j>=0;j--){

      const e = enemies[j];

      const dx = b.x-e.x;
      const dy = b.y-e.y;

      const distance =
        Math.sqrt(dx*dx+dy*dy);

      if(distance < b.radius + e.w/2){

        explode(b.x,b.y,true);

        for(let k=enemies.length-1;k>=0;k--){

          const other = enemies[k];

          const ox=b.x-other.x;
          const oy=b.y-other.y;

          const d=Math.sqrt(ox*ox+oy*oy);

          if(d < 130){

            other.hp -= b.damage;

            if(other.hp <= 0){

              score += 120 + level*20;

              explode(
                other.x,
                other.y,
                true
              );

              enemies.splice(k,1);
            }
          }
        }

        bombs.splice(i,1);

        break;
      }
    }
  }


  /* -----------------------------------------
     ENEMIES
     ----------------------------------------- */

  for(let i=enemies.length-1;i>=0;i--){

    const e=enemies[i];

    e.y += e.speed;


    /* enemy hits player */

    if(

      e.y+e.h/2 >
      player.y-player.h/2 &&

      e.y-e.h/2 <
      player.y+player.h/2 &&

      Math.abs(e.x-player.x)
      <
      (e.w+player.w)/2
    ){

      damagePlayer(15);

      explode(e.x,e.y,true);

      enemies.splice(i,1);

      continue;
    }


    if(e.y > H+100){

      enemies.splice(i,1);

      damagePlayer(5);

      continue;
    }
  }


  /* -----------------------------------------
     EXPLOSIONS
     ----------------------------------------- */

  for(let i=explosions.length-1;i>=0;i--){

    const ex=explosions[i];

    ex.r +=
      (ex.max-ex.r)*dt*5;

    ex.life -= dt;

    if(ex.life<=0){

      explosions.splice(i,1);
    }
  }


  /* -----------------------------------------
     PARTICLES
     ----------------------------------------- */

  for(let i=particles.length-1;i>=0;i--){

    const p=particles[i];

    p.x += p.vx;

    p.y += p.vy;

    p.vy += .08;

    p.life -= dt;

    if(p.life<=0){

      particles.splice(i,1);
    }
  }


  /* -----------------------------------------
     TIME
     ----------------------------------------- */

  timeLeft =
    LEVEL_TIME -
    (performance.now()-levelStart)/1000;

  if(timeLeft < 0)
    timeLeft=0;

  timeEl.textContent =
    Math.ceil(timeLeft);

  scoreEl.textContent =
    Math.floor(score);

  hpEl.textContent =
    Math.floor(player.health);


  /* -----------------------------------------
     LEVEL END
     ----------------------------------------- */

  if(timeLeft <= 0){

    if(score >= targetScore()){

      passLevel();

    }else{

      failLevel("TARGET NOT REACHED");
    }
  }
}


/* =========================================================
   DRAW BACKGROUND
   ========================================================= */

function drawBackground(){

  const g =
    ctx.createLinearGradient(
      0,0,
      0,H
    );

  g.addColorStop(0,"#02030a");
  g.addColorStop(.5,"#071018");
  g.addColorStop(1,"#010204");

  ctx.fillStyle=g;

  ctx.fillRect(
    0,0,W,H
  );


  /* futuristic lights */

  for(let i=0;i<18;i++){

    const x =
      (i*97)%W;

    const y =
      ((performance.now()*.03+i*130)
      %(H+100))-50;

    ctx.fillStyle =
      "rgba(255,30,30,.18)";

    ctx.fillRect(
      x,
      y,
      2,
      35
    );
  }
}


/* =========================================================
   DRAW ROAD
   ========================================================= */

function drawRoad(){

  const roadW =
    Math.min(500,W*.86);

  const left =
    W/2-roadW/2;

  const right =
    W/2+roadW/2;


  ctx.fillStyle="#07090d";

  ctx.fillRect(
    left,
    0,
    roadW,
    H
  );


  /* road edge */

  ctx.fillStyle="#a00000";

  ctx.fillRect(
    left,
    0,
    4,
    H
  );

  ctx.fillRect(
    right-4,
    0,
    4,
    H
  );


  /* lane lines */

  const offset =
    (performance.now()*.25)%80;

  ctx.strokeStyle =
    "rgba(255,255,255,.13)";

  ctx.lineWidth=3;

  for(let y=-80+offset;y<H;y+=80){

    ctx.beginPath();

    ctx.moveTo(
      W/2,
      y
    );

    ctx.lineTo(
      W/2,
      y+38
    );

    ctx.stroke();
  }
}


/* =========================================================
   VIP AI CAR
   ========================================================= */

function drawPlayer(){

  const x=player.x;
  const y=player.y;


  ctx.save();

  /*
    CAR BODY
  */

  ctx.shadowBlur=25;
  ctx.shadowColor="#ff0000";


  /* rear glow */

  const glow =
    ctx.createRadialGradient(
      x,
      y+50,
      5,
      x,
      y+50,
      55
    );

  glow.addColorStop(
    0,
    "rgba(255,20,20,.55)"
  );

  glow.addColorStop(
    1,
    "rgba(255,0,0,0)"
  );

  ctx.fillStyle=glow;

  ctx.fillRect(
    x-65,
    y-70,
    130,
    150
  );


  /* main armored body */

  ctx.beginPath();

  ctx.moveTo(x,y-62);

  ctx.lineTo(x+31,y-45);

  ctx.lineTo(x+39,y+30);

  ctx.lineTo(x+28,y+55);

  ctx.lineTo(x-28,y+55);

  ctx.lineTo(x-39,y+30);

  ctx.lineTo(x-31,y-45);

  ctx.closePath();

  const body =
    ctx.createLinearGradient(
      x-40,y,
      x+40,y
    );

  body.addColorStop(
    0,
    "#08090d"
  );

  body.addColorStop(
    .45,
    "#30343d"
  );

  body.addColorStop(
    .5,
    "#090a0e"
  );

  body.addColorStop(
    .8,
    "#4a0b0b"
  );

  body.addColorStop(
    1,
    "#08090d"
  );

  ctx.fillStyle=body;

  ctx.fill();

  ctx.strokeStyle="#ff2525";

  ctx.lineWidth=2.5;

  ctx.stroke();


  /* cockpit */

  ctx.beginPath();

  ctx.moveTo(x,y-48);

  ctx.lineTo(x+20,y-34);

  ctx.lineTo(x+24,y-4);

  ctx.lineTo(x-24,y-4);

  ctx.lineTo(x-20,y-34);

  ctx.closePath();

  const glass =
    ctx.createLinearGradient(
      x,
      y-50,
      x,
      y
    );

  glass.addColorStop(
    0,
    "#111c2b"
  );

  glass.addColorStop(
    .5,
    "#b40000"
  );

  glass.addColorStop(
    1,
    "#05070a"
  );

  ctx.fillStyle=glass;

  ctx.fill();

  ctx.strokeStyle="#ff3a3a";

  ctx.stroke();


  /* AI red visor */

  ctx.fillStyle="#ff1111";

  ctx.shadowBlur=12;

  ctx.fillRect(
    x-17,
    y-20,
    34,
    4
  );


  /* center armor */

  ctx.fillStyle="#151820";

  ctx.beginPath();

  ctx.moveTo(x,y-2);

  ctx.lineTo(x+19,y+17);

  ctx.lineTo(x+12,y+44);

  ctx.lineTo(x-12,y+44);

  ctx.lineTo(x-19,y+17);

  ctx.closePath();

  ctx.fill();

  ctx.strokeStyle="#9b0000";

  ctx.stroke();


  /* side armor */

  ctx.fillStyle="#4c0b0b";

  ctx.fillRect(
    x-37,
    y+4,
    9,
    33
  );

  ctx.fillRect(
    x+28,
    y+4,
    9,
    33
  );


  /* front energy light */

  ctx.fillStyle="#ff3333";

  ctx.shadowBlur=18;

  ctx.fillRect(
    x-13,
    y+48,
    26,
    4
  );


  /* wheels */

  ctx.shadowBlur=0;

  ctx.fillStyle="#030405";

  ctx.strokeStyle="#777";

  ctx.lineWidth=2;

  ctx.beginPath();

  ctx.roundRect(
    x-47,
    y-24,
    15,
    37,
    5
  );

  ctx.fill();

  ctx.stroke();


  ctx.beginPath();

  ctx.roundRect(
    x+32,
    y-24,
    15,
    37,
    5
  );

  ctx.fill();

  ctx.stroke();


  ctx.beginPath();

  ctx.roundRect(
    x-47,
    y+25,
    15,
    37,
    5
  );

  ctx.fill();

  ctx.stroke();


  ctx.beginPath();

  ctx.roundRect(
    x+32,
    y+25,
    15,
    37,
    5
  );

  ctx.fill();

  ctx.stroke();


  /* wheel red cores */

  ctx.fillStyle="#ff1111";

  ctx.fillRect(
    x-44,
    y-10,
    9,
    15
  );

  ctx.fillRect(
    x+35,
    y-10,
    9,
    15
  );

  ctx.fillRect(
    x-44,
    y+39,
    9,
    15
  );

  ctx.fillRect(
    x+35,
    y+39,
    9,
    15
  );


  /* VIP top antenna */

  ctx.strokeStyle="#ff2222";

  ctx.lineWidth=2;

  ctx.beginPath();

  ctx.moveTo(x,y-62);

  ctx.lineTo(x,y-75);

  ctx.stroke();

  ctx.fillStyle="#ff0000";

  ctx.beginPath();

  ctx.arc(
    x,
    y-78,
    4,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* armor wings */

  ctx.fillStyle="#191c23";

  ctx.strokeStyle="#ff2222";

  ctx.beginPath();

  ctx.moveTo(x-31,y-37);

  ctx.lineTo(x-54,y-25);

  ctx.lineTo(x-38,y-8);

  ctx.closePath();

  ctx.fill();

  ctx.stroke();


  ctx.beginPath();

  ctx.moveTo(x+31,y-37);

  ctx.lineTo(x+54,y-25);

  ctx.lineTo(x+38,y-8);

  ctx.closePath();

  ctx.fill();

  ctx.stroke();


  ctx.restore();
}


/* =========================================================
   DRAW ENEMY
   ========================================================= */

function drawEnemy(e){

  const x=e.x;
  const y=e.y;


  ctx.save();

  ctx.translate(x,y);

  ctx.shadowBlur=18;

  ctx.shadowColor="#ff0000";


  /* enemy body */

  ctx.fillStyle =
    e.type===1
    ? "#300909"
    : "#10141a";

  ctx.strokeStyle="#ff2222";

  ctx.lineWidth=2;

  ctx.beginPath();

  ctx.moveTo(0,-e.h/2);

  ctx.lineTo(e.w/2,e.h/2);

  ctx.lineTo(0,e.h/3);

  ctx.lineTo(-e.w/2,e.h/2);

  ctx.closePath();

  ctx.fill();

  ctx.stroke();


  /* AI eye */

  ctx.fillStyle="#ff0000";

  ctx.fillRect(
    -e.w*.3,
    -4,
    e.w*.6,
    5
  );


  /* wings */

  ctx.fillStyle="#1b1d22";

  ctx.beginPath();

  ctx.moveTo(-e.w/2,10);

  ctx.lineTo(-e.w*.9,25);

  ctx.lineTo(-e.w/2,28);

  ctx.closePath();

  ctx.fill();

  ctx.stroke();


  ctx.beginPath();

  ctx.moveTo(e.w/2,10);

  ctx.lineTo(e.w*.9,25);

  ctx.lineTo(e.w/2,28);

  ctx.closePath();

  ctx.fill();

  ctx.stroke();


  /* health bar */

  ctx.shadowBlur=0;

  ctx.fillStyle="#300";

  ctx.fillRect(
    -25,
    -e.h/2-12,
    50,
    5
  );

  ctx.fillStyle="#ff0000";

  ctx.fillRect(
    -25,
    -e.h/2-12,
    50*(e.hp/e.maxHp),
    5
  );


  ctx.restore();
}


/* =========================================================
   DRAW MISSILES
   ========================================================= */

function drawMissiles(){

  for(const m of missiles){

    ctx.save();

    ctx.translate(
      m.x,
      m.y
    );

    ctx.shadowBlur=15;

    ctx.shadowColor="#ff0000";

    ctx.fillStyle="#ddd";

    ctx.fillRect(
      -4,
      -15,
      8,
      25
    );

    ctx.fillStyle="#ff2222";

    ctx.beginPath();

    ctx.moveTo(0,-23);

    ctx.lineTo(-6,-10);

    ctx.lineTo(6,-10);

    ctx.closePath();

    ctx.fill();

    ctx.fillStyle="#ff6600";

    ctx.fillRect(
      -3,
      10,
      6,
      12
    );

    ctx.restore();
  }
}


/* =========================================================
   DRAW BOMBS
   ========================================================= */

function drawBombs(){

  for(const b of bombs){

    ctx.save();

    ctx.translate(
      b.x,
      b.y
    );

    ctx.shadowBlur=15;

    ctx.shadowColor="#ff0000";

    ctx.fillStyle="#08090b";

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      11,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.strokeStyle="#ff2222";

    ctx.stroke();

    ctx.fillStyle="#ff5500";

    ctx.fillRect(
      -2,
      -19,
      4,
      8
    );

    ctx.restore();
  }
}


/* =========================================================
   DRAW EXPLOSIONS
   ========================================================= */

function drawExplosions(){

  for(const ex of explosions){

    ctx.save();

    ctx.globalAlpha =
      Math.max(0,ex.life);

    ctx.shadowBlur=30;

    ctx.shadowColor="#ff2200";

    const g =
      ctx.createRadialGradient(
        ex.x,
        ex.y,
        2,
        ex.x,
        ex.y,
        ex.r
      );

    g.addColorStop(
      0,
      "#ffffff"
    );

    g.addColorStop(
      .2,
      "#ffff00"
    );

    g.addColorStop(
      .5,
      "#ff5500"
    );

    g.addColorStop(
      1,
      "rgba(255,0,0,0)"
    );

    ctx.fillStyle=g;

    ctx.beginPath();

    ctx.arc(
      ex.x,
      ex.y,
      ex.r,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.restore();
  }
}


/* =========================================================
   DRAW PARTICLES
   ========================================================= */

function drawParticles(){

  for(const p of particles){

    ctx.save();

    ctx.globalAlpha =
      Math.max(0,p.life);

    ctx.fillStyle =
      p.type==="fire"
      ? "#ff3b00"
      : "#ffffff";

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      p.size,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.restore();
  }
}


/* =========================================================
   DRAW
   ========================================================= */

function draw(){

  ctx.clearRect(
    0,
    0,
    W,
    H
  );

  drawBackground();

  drawRoad();

  drawMissiles();

  drawBombs();

  for(const e of enemies){

    drawEnemy(e);
  }

  /* CAR IS DRAWN LAST */

  drawPlayer();

  drawExplosions();

  drawParticles();
}


/* =========================================================
   PASS
   ========================================================= */

function passLevel(){

  running=false;

  passSound();

  screenTitle.textContent =
    "LEVEL "+level+" PASSED";

  screenText.innerHTML =
    "Target destroyed.<br><br>" +
    "Score: <b>"+Math.floor(score)+"</b><br>" +
    "Next level incoming...";

  startBtn.textContent =
    "NEXT LEVEL";

  screen.classList.remove("hidden");

  setTimeout(()=>{

    level++;

    startLevel();

  },1400);
}


/* =========================================================
   FAIL
   ========================================================= */

function failLevel(reason){

  running=false;

  sound(
    80,
    .5,
    "sawtooth",
    .08
  );

  screenTitle.textContent =
    "LEVEL "+level+" FAILED";

  screenText.innerHTML =
    reason+
    "<br><br>" +
    "Target: <b>"+targetScore()+"</b><br>" +
    "Your score: <b>"+Math.floor(score)+"</b>";

  startBtn.textContent =
    "RETRY LEVEL";

  screen.classList.remove("hidden");
}


/* =========================================================
   START BUTTON
   ========================================================= */

startBtn.addEventListener(
  "click",
  ()=>{

    audioStart();

    if(
      startBtn.textContent===
      "RETRY LEVEL"
    ){

      score=0;
    }

    startLevel();
  }
);


/* =========================================================
   TOUCH CONTROLS
   ========================================================= */

function holdButton(
  element,
  onStart,
  onEnd
){

  element.addEventListener(
    "pointerdown",
    e=>{

      e.preventDefault();

      onStart();
    }
  );

  element.addEventListener(
    "pointerup",
    e=>{

      e.preventDefault();

      onEnd();
    }
  );

  element.addEventListener(
    "pointercancel",
    onEnd
  );

  element.addEventListener(
    "pointerleave",
    onEnd
  );
}


holdButton(
  document.getElementById("left"),

  ()=>{
    moveLeft=true;
  },

  ()=>{
    moveLeft=false;
  }
);


holdButton(
  document.getElementById("right"),

  ()=>{
    moveRight=true;
  },

  ()=>{
    moveRight=false;
  }
);


document.getElementById(
  "missile"
).addEventListener(
  "pointerdown",
  e=>{

    e.preventDefault();

    fireMissile();
  }
);


document.getElementById(
  "bomb"
).addEventListener(
  "pointerdown",
  e=>{

    e.preventDefault();

    fireBomb();
  }
);


/* =========================================================
   KEYBOARD
   ========================================================= */

window.addEventListener(
  "keydown",
  e=>{

    if(e.key==="ArrowLeft")
      moveLeft=true;

    if(e.key==="ArrowRight")
      moveRight=true;

    if(e.key===" "){
      e.preventDefault();
      fireMissile();
    }

    if(
      e.key==="b" ||
      e.key==="B"
    ){
      fireBomb();
    }
  }
);


window.addEventListener(
  "keyup",
  e=>{

    if(e.key==="ArrowLeft")
      moveLeft=false;

    if(e.key==="ArrowRight")
      moveRight=false;
  }
);


/* =========================================================
   MAIN LOOP
   ========================================================= */

function gameLoop(now){

  const dt =
    Math.min(
      .05,
      (now-lastTime)/1000
    );

  lastTime=now;

  update(dt);

  draw();

  requestAnimationFrame(
    gameLoop
  );
}


requestAnimationFrame(
  gameLoop
);

</script>
