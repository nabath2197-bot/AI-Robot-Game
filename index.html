
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>AI ROBOT - CORE BREAKER</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#02040a;
  color:white;
  font-family:Arial,sans-serif;
}

#game{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 35%,#173653 0%,#081321 45%,#010207 100%);
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}

#hud{
  position:absolute;
  top:10px;
  left:8px;
  right:8px;
  z-index:5;
  display:flex;
  justify-content:space-between;
  gap:5px;
}

.box{
  padding:7px 9px;
  border:1px solid #21ddff;
  border-radius:9px;
  background:rgba(2,10,20,.88);
  box-shadow:0 0 12px rgba(0,220,255,.3);
  font-size:12px;
  white-space:nowrap;
}

#start,
#gameover,
#win{
  position:absolute;
  inset:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(1,4,10,.93);
}

.panel{
  width:min(90%,420px);
  padding:27px;
  text-align:center;
  border:1px solid #25ddff;
  border-radius:20px;
  background:#07111f;
  box-shadow:
    0 0 35px rgba(0,220,255,.3),
    inset 0 0 25px rgba(0,120,255,.08);
}

h1{
  margin:0 0 8px;
  color:#35e8ff;
  font-size:30px;
  text-shadow:0 0 15px #00d9ff;
}

h2{
  margin:8px 0;
}

.sub{
  color:#aebdd0;
  line-height:1.5;
}

button{
  width:100%;
  margin-top:15px;
  padding:14px;
  border:0;
  border-radius:12px;
  background:#16c9ff;
  color:#001018;
  font-size:17px;
  font-weight:bold;
  box-shadow:0 0 15px rgba(0,220,255,.35);
}

button:active{
  transform:scale(.95);
}

#controls{
  position:absolute;
  bottom:22px;
  left:0;
  right:0;
  z-index:10;
  display:flex;
  justify-content:center;
  gap:14px;
}

.ctrl{
  width:64px;
  height:64px;
  margin:0;
  padding:0;
  border-radius:50%;
  background:rgba(7,25,45,.9);
  color:white;
  border:1px solid #20ddff;
  font-size:25px;
}

#fire{
  background:rgba(130,8,20,.9);
  border-color:#ff4050;
  box-shadow:0 0 18px rgba(255,30,50,.4);
}

#timer{
  color:#ffe600;
}

#danger{
  position:absolute;
  inset:0;
  z-index:4;
  pointer-events:none;
  border:0 solid rgba(255,0,0,0);
}

.danger{
  animation:dangerFlash .25s infinite;
}

@keyframes dangerFlash{
  0%{border:4px solid rgba(255,0,0,.05)}
  50%{border:4px solid rgba(255,0,0,.65)}
  100%{border:4px solid rgba(255,0,0,.05)}
}
</style>
</head>

<body>

<div id="game">

<canvas id="canvas"></canvas>

<div id="hud">

  <div class="box">
    ⚡ SCORE: <span id="score">0</span>
  </div>

  <div class="box">
    ⏱️ <span id="timer">30</span>s
  </div>

  <div class="box">
    💎 <span id="energy">100</span>
  </div>

</div>

<div id="danger"></div>


<!-- START -->

<div id="start">

  <div class="panel">

    <h1>AI ROBOT</h1>

    <h2>CORE BREAKER</h2>

    <p class="sub">
      ENTER THE ABANDONED AI LABORATORY.<br><br>
      DESTROY THE ENEMY DRONES.<br>
      COLLECT ENERGY.<br>
      SURVIVE FOR 30 SECONDS.
    </p>

    <button id="startBtn">
      START MISSION
    </button>

  </div>

</div>


<!-- GAME OVER -->

<div id="gameover" style="display:none">

  <div class="panel">

    <h1>MISSION FAILED</h1>

    <p class="sub">
      YOUR CORE ENERGY HAS BEEN DESTROYED.
    </p>

    <h2>
      SCORE: <span id="finalScore">0</span>
    </h2>

    <button id="restartBtn">
      PLAY AGAIN
    </button>

  </div>

</div>


<!-- WIN -->

<div id="win" style="display:none">

  <div class="panel">

    <h1>CORE DESTROYED!</h1>

    <p class="sub">
      MISSION COMPLETE.<br>
      THE AI LABORATORY IS SECURE.
    </p>

    <h2>
      SCORE: <span id="winScore">0</span>
    </h2>

    <button id="winBtn">
      PLAY AGAIN
    </button>

  </div>

</div>


<!-- CONTROLS -->

<div id="controls">

  <button class="ctrl" id="left">
    ◀
  </button>

  <button class="ctrl" id="fire">
    ⚡
  </button>

  <button class="ctrl" id="right">
    ▶
  </button>

</div>

</div>


<script>

/* =====================================================
   CANVAS
===================================================== */

const canvas =
  document.getElementById("canvas");

const ctx =
  canvas.getContext("2d");

let W = 0;
let H = 0;

function resize(){

  const dpr =
    Math.min(window.devicePixelRatio || 1,2);

  W = window.innerWidth;
  H = window.innerHeight;

  canvas.width = W*dpr;
  canvas.height = H*dpr;

  ctx.setTransform(
    dpr,0,0,dpr,0,0
  );
}

window.addEventListener(
  "resize",
  resize
);

resize();


/* =====================================================
   8-BIT SOUND ENGINE
===================================================== */

let audioCtx = null;

function initSound(){

  if(!audioCtx){

    audioCtx =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();
  }

  if(audioCtx.state === "suspended"){
    audioCtx.resume();
  }
}


function beep(
  frequency,
  duration,
  type="square",
  volume=.06
){

  if(!audioCtx) return;

  const osc =
    audioCtx.createOscillator();

  const gain =
    audioCtx.createGain();

  osc.type = type;

  osc.frequency.setValueAtTime(
    frequency,
    audioCtx.currentTime
  );

  gain.gain.setValueAtTime(
    volume,
    audioCtx.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    audioCtx.currentTime + duration
  );

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start();

  osc.stop(
    audioCtx.currentTime + duration
  );
}


/* START 8-BIT */

function startSound(){

  initSound();

  beep(110,.12,"square",.08);

  setTimeout(
    ()=>beep(165,.12,"square",.07),
    100
  );

  setTimeout(
    ()=>beep(220,.12,"square",.07),
    200
  );

  setTimeout(
    ()=>beep(330,.20,"square",.09),
    300
  );

  setTimeout(
    ()=>beep(660,.35,"sawtooth",.06),
    430
  );
}


/* LASER */

function laserSound(){

  initSound();

  beep(
    1000,
    .045,
    "square",
    .07
  );

  setTimeout(
    ()=>beep(400,.07,"square",.035),
    25
  );
}


/* BIG EXPLOSION */

function explosionSound(){

  initSound();

  beep(
    90,
    .30,
    "sawtooth",
    .12
  );

  setTimeout(
    ()=>beep(55,.30,"square",.10),
    70
  );

  setTimeout(
    ()=>beep(180,.12,"sawtooth",.05),
    150
  );
}


/* ENERGY */

function energySound(){

  initSound();

  beep(
    500,
    .08,
    "square",
    .06
  );

  setTimeout(
    ()=>beep(800,.12,"square",.06),
    80
  );
}


/* HIT */

function hitSound(){

  initSound();

  beep(
    120,
    .12,
    "square",
    .07
  );
}


/* COUNTDOWN */

function countdownSound(){

  initSound();

  beep(
    700,
    .08,
    "square",
    .07
  );
}


/* WIN */

function winSound(){

  initSound();

  beep(330,.12,"square",.07);

  setTimeout(
    ()=>beep(440,.12,"square",.07),
    120
  );

  setTimeout(
    ()=>beep(660,.18,"square",.08),
    240
  );

  setTimeout(
    ()=>beep(880,.35,"square",.08),
    400
  );
}


/* GAME OVER */

function gameOverSound(){

  initSound();

  beep(330,.15,"sawtooth",.07);

  setTimeout(
    ()=>beep(220,.18,"sawtooth",.07),
    180
  );

  setTimeout(
    ()=>beep(110,.35,"square",.08),
    400
  );
}


/* =====================================================
   GAME VARIABLES
===================================================== */

let running = false;

let score = 0;

let energy = 100;

let timeLeft = 30;

let lastTime = 0;

let enemyTimer = 0;

let crystalTimer = 0;

let enemies = [];

let shots = [];

let crystals = [];

let particles = [];

let leftPressed = false;

let rightPressed = false;


/* =====================================================
   ROBOT
===================================================== */

const robot = {

  x: W/2,

  y: H-130,

  size:30,

  speed:7
};


/* =====================================================
   START GAME
===================================================== */

function startGame(){

  initSound();

  startSound();

  running = true;

  score = 0;

  energy = 100;

  timeLeft = 30;

  enemyTimer = 0;

  crystalTimer = 0;

  enemies = [];

  shots = [];

  crystals = [];

  particles = [];

  robot.x = W/2;

  robot.y = H-130;

  document.getElementById(
    "start"
  ).style.display = "none";

  document.getElementById(
    "gameover"
  ).style.display = "none";

  document.getElementById(
    "win"
  ).style.display = "none";

  document.getElementById(
    "danger"
  ).classList.remove("danger");

  updateHUD();

  lastTime =
    performance.now();

  requestAnimationFrame(gameLoop);
}


/* =====================================================
   GAME OVER
===================================================== */

function gameOver(){

  if(!running) return;

  running = false;

  gameOverSound();

  document.getElementById(
    "finalScore"
  ).textContent = score;

  document.getElementById(
    "gameover"
  ).style.display = "flex";
}


/* =====================================================
   WIN
===================================================== */

function winGame(){

  if(!running) return;

  running = false;

  winSound();

  document.getElementById(
    "winScore"
  ).textContent = score;

  document.getElementById(
    "win"
  ).style.display = "flex";
}


/* =====================================================
   SHOOT
===================================================== */

function shoot(){

  if(!running) return;

  laserSound();

  shots.push({

    x:robot.x,

    y:robot.y-30,

    vy:-11
  });
}


/* =====================================================
   ENEMY
===================================================== */

function spawnEnemy(){

  enemies.push({

    x:
      25 +
      Math.random() *
      Math.max(10,W-50),

    y:-40,

    size:
      25 +
      Math.random()*15,

    vy:
      2 +
      Math.random()*2 +
      score*.002
  });
}


/* =====================================================
   CRYSTAL
===================================================== */

function spawnCrystal(){

  crystals.push({

    x:
      25 +
      Math.random() *
      Math.max(10,W-50),

    y:-20,

    size:14,

    vy:2
  });
}


/* =====================================================
   EXPLOSION PARTICLES
===================================================== */

function explode(x,y){

  explosionSound();

  for(
    let i=0;
    i<22;
    i++
  ){

    particles.push({

      x:x,

      y:y,

      vx:
        (Math.random()-.5)*8,

      vy:
        (Math.random()-.5)*8,

      life:1
    });
  }
}


/* =====================================================
   UPDATE
===================================================== */

function update(dt){

  /* ROBOT */

  if(leftPressed){
    robot.x -= robot.speed;
  }

  if(rightPressed){
    robot.x += robot.speed;
  }

  robot.x =
    Math.max(
      25,
      Math.min(
        W-25,
        robot.x
      )
    );


  /* TIMER */

  timeLeft -= dt/1000;

  if(
    timeLeft <= 5 &&
    timeLeft > 0
  ){

    document
      .getElementById("danger")
      .classList.add("danger");

  }else{

    document
      .getElementById("danger")
      .classList.remove("danger");
  }


  if(timeLeft <= 0){

    timeLeft = 0;

    updateHUD();

    winGame();

    return;
  }


  /* SHOTS */

  for(
    let i=shots.length-1;
    i>=0;
    i--
  ){

    const s = shots[i];

    s.y += s.vy;

    if(s.y < -30){

      shots.splice(i,1);
    }
  }


  /* ENEMY SPAWN */

  enemyTimer += dt;

  if(
    enemyTimer >
    Math.max(
      250,
      850-score*2
    )
  ){

    spawnEnemy();

    enemyTimer = 0;
  }


  /* CRYSTALS */

  crystalTimer += dt;

  if(crystalTimer > 2200){

    spawnCrystal();

    crystalTimer = 0;
  }


  /* ENEMIES */

  for(
    let i=enemies.length-1;
    i>=0;
    i--
  ){

    const e = enemies[i];

    e.y += e.vy;


    /* ROBOT COLLISION */

    if(
      Math.abs(e.x-robot.x)
      < e.size+10
      &&
      Math.abs(e.y-robot.y)
      < e.size+15
    ){

      energy -= 15;

      hitSound();

      explode(
        e.x,
        e.y
      );

      enemies.splice(i,1);

      if(energy<=0){

        energy=0;

        updateHUD();

        gameOver();

        return;
      }

      continue;
    }


    if(e.y > H+60){

      enemies.splice(i,1);
    }
  }


  /* SHOT COLLISION */

  for(
    let i=shots.length-1;
    i>=0;
    i--
  ){

    const s = shots[i];

    let destroyed = false;

    for(
      let j=enemies.length-1;
      j>=0;
      j--
    ){

      const e = enemies[j];

      if(
        Math.abs(s.x-e.x)
        < e.size
        &&
        Math.abs(s.y-e.y)
        < e.size
      ){

        score += 10;

        explode(
          e.x,
          e.y
        );

        shots.splice(i,1);

        enemies.splice(j,1);

        destroyed = true;

        break;
      }
    }

    if(destroyed) continue;
  }


  /* CRYSTALS */

  for(
    let i=crystals.length-1;
    i>=0;
    i--
  ){

    const c = crystals[i];

    c.y += c.vy;

    if(
      Math.abs(c.x-robot.x)<32
      &&
      Math.abs(c.y-robot.y)<32
    ){

      energy =
        Math.min(
          100,
          energy+20
        );

      energySound();

      crystals.splice(i,1);

      continue;
    }

    if(c.y > H+30){

      crystals.splice(i,1);
    }
  }


  /* PARTICLES */

  for(
    let i=particles.length-1;
    i>=0;
    i--
  ){

    const p = particles[i];

    p.x += p.vx;

    p.y += p.vy;

    p.life -= .035;

    if(p.life<=0){

      particles.splice(i,1);
    }
  }


  updateHUD();
}


/* =====================================================
   BACKGROUND
===================================================== */

function drawBackground(){

  ctx.fillStyle =
    "#020711";

  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  /* GRID */

  ctx.strokeStyle =
    "rgba(30,200,255,.10)";

  ctx.lineWidth = 1;

  const grid = 40;

  for(
    let x=0;
    x<W;
    x+=grid
  ){

    ctx.beginPath();

    ctx.moveTo(x,0);

    ctx.lineTo(x,H);

    ctx.stroke();
  }

  for(
    let y=0;
    y<H;
    y+=grid
  ){

    ctx.beginPath();

    ctx.moveTo(0,y);

    ctx.lineTo(W,y);

    ctx.stroke();
  }


  /* MOVING LASER LINES */

  for(
    let i=0;
    i<6;
    i++
  ){

    const y =
      (
        performance.now()/12
        +
        i*130
      ) % H;

    ctx.strokeStyle =
      "rgba(0,220,255,.07)";

    ctx.beginPath();

    ctx.moveTo(0,y);

    ctx.lineTo(W,y);

    ctx.stroke();
  }
}


/* =====================================================
   ROBOT
===================================================== */

function drawRobot(){

  ctx.save();

  ctx.translate(
    robot.x,
    robot.y
  );

  ctx.shadowBlur = 20;

  ctx.shadowColor =
    "#00eaff";


  /* BODY */

  ctx.fillStyle =
    "#12bfe8";

  ctx.fillRect(
    -18,
    -14,
    36,
    31
  );


  /* HEAD */

  ctx.fillStyle =
    "#d9fbff";

  ctx.fillRect(
    -16,
    -35,
    32,
    21
  );


  /* EYES */

  ctx.fillStyle =
    "#ff3048";

  ctx.fillRect(
    -10,
    -28,
    6,
    6
  );

  ctx.fillRect(
    4,
    -28,
    6,
    6
  );


  /* CORE */

  ctx.fillStyle =
    "#ffffff";

  ctx.beginPath();

  ctx.arc(
    0,
    2,
    7,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* LEGS */

  ctx.fillStyle =
    "#087f9f";

  ctx.fillRect(
    -15,
    17,
    10,
    13
  );

  ctx.fillRect(
    5,
    17,
    10,
    13
  );


  ctx.restore();
}


/* =====================================================
   ENEMY
===================================================== */

function drawEnemy(e){

  ctx.save();

  ctx.translate(
    e.x,
    e.y
  );

  ctx.shadowBlur = 18;

  ctx.shadowColor =
    "#ff1538";


  ctx.fillStyle =
    "#a30d28";

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    e.size,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.fillStyle =
    "#ff5065";

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    e.size*.35,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.fillStyle =
    "#05070c";

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    e.size*.14,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.restore();
}


/* =====================================================
   SHOTS
===================================================== */

function drawShots(){

  ctx.save();

  ctx.shadowBlur = 18;

  ctx.shadowColor =
    "#00ffff";

  ctx.fillStyle =
    "#7fffff";

  for(const s of shots){

    ctx.fillRect(
      s.x-3,
      s.y-13,
      6,
      22
    );
  }

  ctx.restore();
}


/* =====================================================
   CRYSTALS
===================================================== */

function drawCrystals(){

  ctx.save();

  ctx.shadowBlur = 20;

  ctx.shadowColor =
    "#00ffb7";

  ctx.fillStyle =
    "#16ffc0";

  for(const c of crystals){

    ctx.beginPath();

    ctx.moveTo(
      c.x,
      c.y-c.size
    );

    ctx.lineTo(
      c.x+c.size,
      c.y
    );

    ctx.lineTo(
      c.x,
      c.y+c.size
    );

    ctx.lineTo(
      c.x-c.size,
      c.y
    );

    ctx.closePath();

    ctx.fill();
  }

  ctx.restore();
}


/* =====================================================
   PARTICLES
===================================================== */

function drawParticles(){

  for(const p of particles){

    ctx.globalAlpha =
      Math.max(0,p.life);

    ctx.fillStyle =
      "#ff4050";

    ctx.fillRect(
      p.x,
      p.y,
      4,
      4
    );
  }

  ctx.globalAlpha=1;
}


/* =====================================================
   DRAW
===================================================== */

function draw(){

  drawBackground();

  drawCrystals();

  drawShots();

  for(
    const e of enemies
  ){
    drawEnemy(e);
  }

  drawRobot();

  drawParticles();
}


/* =====================================================
   HUD
===================================================== */

function updateHUD(){

  document.getElementById(
    "score"
  ).textContent = score;

  document.getElementById(
    "energy"
  ).textContent = energy;

  document.getElementById(
    "timer"
  ).textContent =
    Math.ceil(timeLeft);
}


/* =====================================================
   GAME LOOP
===================================================== */

function gameLoop(time){

  if(!running) return;

  const dt =
    Math.min(
      50,
      time-lastTime
    );

  lastTime = time;

  update(dt);

  draw();

  if(running){

    requestAnimationFrame(
      gameLoop
    );
  }
}


/* =====================================================
   BUTTONS
===================================================== */

document.getElementById(
  "startBtn"
).addEventListener(
  "click",
  startGame
);

document.getElementById(
  "restartBtn"
).addEventListener(
  "click",
  startGame
);

document.getElementById(
  "winBtn"
).addEventListener(
  "click",
  startGame
);


/* =====================================================
   MOBILE CONTROLS
===================================================== */

const leftBtn =
  document.getElementById("left");

const rightBtn =
  document.getElementById("right");

const fireBtn =
  document.getElementById("fire");


function leftDown(e){

  e.preventDefault();

  leftPressed=true;
}

function leftUp(e){

  e.preventDefault();

  leftPressed=false;
}


function rightDown(e){

  e.preventDefault();

  rightPressed=true;
}

function rightUp(e){

  e.preventDefault();

  rightPressed=false;
}


leftBtn.addEventListener(
  "touchstart",
  leftDown,
  {passive:false}
);

leftBtn.addEventListener(
  "touchend",
  leftUp,
  {passive:false}
);

leftBtn.addEventListener(
  "touchcancel",
  leftUp,
  {passive:false}
);


rightBtn.addEventListener(
  "touchstart",
  rightDown,
  {passive:false}
);

rightBtn.addEventListener(
  "touchend",
  rightUp,
  {passive:false}
);

rightBtn.addEventListener(
  "touchcancel",
  rightUp,
  {passive:false}
);


fireBtn.addEventListener(
  "touchstart",
  function(e){

    e.preventDefault();

    shoot();

  },
  {passive:false}
);


/* MOUSE */

leftBtn.addEventListener(
  "mousedown",
  ()=>leftPressed=true
);

leftBtn.addEventListener(
  "mouseup",
  ()=>leftPressed=false
);

rightBtn.addEventListener(
  "mousedown",
  ()=>rightPressed=true
);

rightBtn.addEventListener(
  "mouseup",
  ()=>rightPressed=false
);

fireBtn.addEventListener(
  "mousedown",
  shoot
);


/* KEYBOARD */

window.addEventListener(
  "keydown",
  function(e){

    if(e.key==="ArrowLeft")
      leftPressed=true;

    if(e.key==="ArrowRight")
      rightPressed=true;

    if(e.code==="Space")
      shoot();
  }
);


window.addEventListener(
  "keyup",
  function(e){

    if(e.key==="ArrowLeft")
      leftPressed=false;

    if(e.key==="ArrowRight")
      rightPressed=false;
  }
);


/* INITIAL */

robot.x = W/2;

robot.y = H-130;

draw();

</script>

</body>
</html>
