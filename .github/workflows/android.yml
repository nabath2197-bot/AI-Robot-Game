name: Build MS-MS ROBOT Android App

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - '.github/workflows/android.yml'
      - 'manifest.json'
      - 'sw.js'
      - 'cyborg.png'

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout game
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Create Capacitor project
        run: |
          rm -rf www android

          mkdir -p www

          cp index.html www/index.html
          cp manifest.json www/manifest.json
          cp sw.js www/sw.js
          cp cyborg.png www/cyborg.png

          cat > package.json <<'EOF'
          {
            "name": "ms-ms-robot",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "build": "echo Build complete"
            }
          }
          EOF

          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

          npx cap init "MS-MS ROBOT" "com.nabath2197.msmsrobot" --web-dir www

          npx cap add android

      - name: Set Android minimum SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/variables.gradle")
          s = p.read_text()

          import re

          s = re.sub(
              r'minSdkVersion\s*=\s*\d+',
              'minSdkVersion = 24',
              s
          )

          p.write_text(s)
          PY

      - name: Add Google Mobile Ads SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")
          s = p.read_text()

          dependency = "    implementation 'com.google.android.gms:play-services-ads:25.5.0'\n"

          if "com.google.android.gms:play-services-ads:" not in s:
              match = re.search(r"dependencies\s*\{", s)

              if not match:
                  raise SystemExit("dependencies block not found")

              pos = match.end()
              s = s[:pos] + "\n" + dependency + s[pos:]

          p.write_text(s)
          PY

      - name: Configure AdMob App ID
        run: |
          mkdir -p android/app/src/main/res/values

          cat > android/app/src/main/res/values/admob_strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="admob_app_id">ca-app-pub-1151458872743849~3911289378</string>
          </resources>
          EOF

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          if "com.google.android.gms.ads.APPLICATION_ID" not in s:
              marker = "<application"
              start = s.find(marker)

              if start == -1:
                  raise SystemExit("application tag not found")

              insert_pos = s.find(">", start) + 1

              meta = '''
                  <meta-data
                      android:name="com.google.android.gms.ads.APPLICATION_ID"
                      android:value="@string/admob_app_id" />
              '''

              s = s[:insert_pos] + meta + s[insert_pos:]

          p.write_text(s)
          PY

      - name: Create native AdMob Banner
        run: |
          mkdir -p android/app/src/main/java/com/nabath2197/msmsrobot

          cat > android/app/src/main/java/com/nabath2197/msmsrobot/MainActivity.java <<'EOF'
          package com.nabath2197.msmsrobot;

          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.ViewGroup;
          import android.widget.FrameLayout;

          import com.getcapacitor.BridgeActivity;
          import com.google.android.gms.ads.AdRequest;
          import com.google.android.gms.ads.AdSize;
          import com.google.android.gms.ads.AdView;
          import com.google.android.gms.ads.MobileAds;

          public class MainActivity extends BridgeActivity {

              private AdView adView;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  MobileAds.initialize(this, initializationStatus -> {
                      showBanner();
                  });
              }

              private void showBanner() {
                  runOnUiThread(() -> {

                      if (adView != null) {
                          return;
                      }

                      adView = new AdView(this);

                      adView.setAdSize(AdSize.BANNER);

                      adView.setAdUnitId(
                          "ca-app-pub-1151458872743849/3161489499"
                      );

                      AdRequest adRequest =
                          new AdRequest.Builder().build();

                      adView.loadAd(adRequest);

                      FrameLayout root =
                          findViewById(android.R.id.content);

                      FrameLayout.LayoutParams params =
                          new FrameLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT,
                              ViewGroup.LayoutParams.WRAP_CONTENT
                          );

                      params.gravity =
                          Gravity.BOTTOM | Gravity.CENTER_HORIZONTAL;

                      params.bottomMargin =
                          (int)(105 * getResources().getDisplayMetrics().density);

                      root.addView(adView, params);
                  });
              }

              @Override
              public void onDestroy() {
                  if (adView != null) {
                      adView.destroy();
                      adView = null;
                  }

                  super.onDestroy();
              }
          }
          EOF
      - name: Sync Capacitor
        run: |
          npx cap sync android

      - name: Build Android AAB and APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
          ./gradlew assembleRelease
          echo "APK files:"
          find . -type f -name "*.apk" -print

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: MS-MS-ROBOT-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MS-MS-ROBOT-APK
          path: android/**/build/outputs/apk/release/*.apk
          retention-days: 30
